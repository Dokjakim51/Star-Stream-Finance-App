<style>
:root {
    --bg: #090f26;
    --bg-deep: #070c1d;
    --surface: #111936;
    --surface-2: #162044;
    --surface-3: #1c2852;
    --surface-soft: rgba(27, 38, 78, .68);
    --border: rgba(142, 160, 222, .18);
    --border-strong: rgba(150, 164, 238, .32);
    --text: #f6f7ff;
    --muted: #9dacda;
    --muted-2: #7180aa;
    --primary: #7d71ff;
    --primary-2: #5b7cf5;
    --primary-soft: rgba(125, 113, 255, .14);
    --green: #4ed3aa;
    --green-soft: rgba(78, 211, 170, .12);
    --red: #ff7f93;
    --red-soft: rgba(255, 127, 147, .12);
    --gold: #e9c46a;
    --gold-soft: rgba(233, 196, 106, .12);
    --info: #7eb6ff;
    --shadow: 0 22px 60px rgba(0, 0, 0, .28);
    --shadow-soft: 0 10px 30px rgba(0, 0, 0, .18);
    --radius-xl: 28px;
    --radius-lg: 22px;
    --radius-md: 16px;
    --radius-sm: 12px;
    --sidebar: 278px;
    --transition: 180ms ease;
    font-family: Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }

  * { box-sizing: border-box; }
  html { min-height: 100%; background: var(--bg); }
  body {
    margin: 0;
    min-width: 0;
    min-height: 100vh;
    background:
      radial-gradient(circle at 78% -10%, rgba(114, 92, 255, .16), transparent 34%),
      radial-gradient(circle at 18% 16%, rgba(68, 129, 255, .08), transparent 30%),
      var(--bg);
    color: var(--text);
    overflow-x: hidden;
  }

  button, input, select, textarea { font: inherit; }
  button { color: inherit; }
  button, [role="button"] { -webkit-tap-highlight-color: transparent; }
  button:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible {
    outline: 3px solid rgba(139, 125, 255, .28);
    outline-offset: 2px;
  }

  .app-shell { min-height: 100vh; position: relative; }
  .ambient { position: fixed; pointer-events: none; filter: blur(70px); opacity: .35; z-index: 0; }
  .ambient-a { width: 260px; height: 260px; background: #5947c8; top: 8%; right: 5%; border-radius: 50%; }
  .ambient-b { width: 220px; height: 220px; background: #14488c; bottom: 8%; left: 15%; border-radius: 50%; opacity: .22; }

  .sidebar {
    position: fixed;
    inset: 0 auto 0 0;
    width: var(--sidebar);
    padding: 30px 22px 24px;
    background: rgba(8, 14, 34, .92);
    border-right: 1px solid var(--border);
    backdrop-filter: blur(18px);
    display: flex;
    flex-direction: column;
    z-index: 20;
  }

  .brand { display: flex; align-items: center; gap: 13px; padding: 6px 10px 28px; }
  .brand-mark { color: #bea9ff; font-size: 24px; text-shadow: 0 0 22px rgba(183, 155, 255, .6); }
  .brand strong { letter-spacing: .16em; font-size: 15px; }
  .brand small { display: block; color: var(--muted-2); margin-top: 5px; font-size: 11px; }
  .side-nav { display: grid; gap: 8px; }
  .nav-item {
    width: 100%; border: 0; background: transparent; color: #b9c3eb;
    min-height: 52px; display: flex; align-items: center; gap: 14px;
    padding: 0 14px; border-radius: 15px; cursor: pointer; text-align: left;
    transition: background var(--transition), color var(--transition), transform var(--transition);
  }
  .nav-item:hover { background: rgba(125, 113, 255, .08); color: #fff; }
  .nav-item:active { transform: scale(.985); }
  .nav-item.active { background: linear-gradient(135deg, rgba(125,113,255,.22), rgba(91,124,245,.12)); color: #fff; box-shadow: inset 0 0 0 1px rgba(160,145,255,.12); }
  .nav-icon, .nav-item svg { width: 20px; height: 20px; flex: 0 0 20px; }
  .sidebar-footer { margin-top: auto; display: grid; gap: 14px; }
  .version-chip { color: var(--muted-2); font-size: 11px; padding: 0 14px; }

  .main-shell {
    position: relative;
    z-index: 1;
    margin-left: var(--sidebar);
    min-height: 100vh;
    padding: 36px clamp(24px, 4vw, 62px) 70px;
  }

  .topbar { display: flex; align-items: flex-start; justify-content: space-between; gap: 28px; margin-bottom: 28px; }
  .mobile-brand { display: none; }
  .page-heading { min-width: 0; }
  .eyebrow { display: block; color: #ac9cff; letter-spacing: .15em; font-size: 11px; font-weight: 800; margin-bottom: 8px; }
  .page-heading h1 { margin: 0; font-size: clamp(30px, 3vw, 42px); letter-spacing: -.035em; }
  .page-heading p { color: var(--muted); margin: 7px 0 0; font-size: 15px; }
  .topbar-actions { display: flex; align-items: center; gap: 10px; }
  .mobile-settings { display: none; }

  .button {
    border: 1px solid transparent; min-height: 46px; padding: 0 18px; border-radius: 14px;
    display: inline-flex; align-items: center; justify-content: center; gap: 9px;
    cursor: pointer; font-weight: 750; transition: transform var(--transition), filter var(--transition), background var(--transition), border-color var(--transition);
  }
  .button:hover { filter: brightness(1.08); }
  .button:active { transform: translateY(1px) scale(.99); }
  .button:disabled { opacity: .5; cursor: not-allowed; filter: none; }
  .button-primary { background: linear-gradient(135deg, var(--primary), var(--primary-2)); color: #fff; box-shadow: 0 12px 28px rgba(91, 94, 240, .25); }
  .button-secondary { background: rgba(255,255,255,.05); border-color: var(--border); color: #eef0ff; }
  .button-danger { background: var(--red-soft); border-color: rgba(255,127,147,.26); color: #ff9aaa; }
  .button-ghost { background: transparent; border-color: transparent; color: var(--muted); }
  .button-sm { min-height: 38px; padding: 0 13px; border-radius: 12px; font-size: 13px; }
  .button svg { width: 17px; height: 17px; }

  .icon-button {
    width: 44px; height: 44px; border-radius: 13px; border: 1px solid var(--border);
    background: rgba(255,255,255,.04); display: grid; place-items: center; cursor: pointer;
  }
  .icon-button:hover { background: rgba(255,255,255,.08); }
  .icon-button svg { width: 20px; height: 20px; }

  .view { min-width: 0; animation: fadeIn .22s ease; }
  @keyframes fadeIn { from { opacity: .45; transform: translateY(4px); } to { opacity: 1; transform: translateY(0); } }

  .dashboard-grid { display: grid; grid-template-columns: minmax(0, 1.65fr) repeat(2, minmax(210px, .8fr)); gap: 16px; }
  .card {
    background: linear-gradient(180deg, rgba(23,33,69,.92), rgba(17,25,54,.92));
    border: 1px solid var(--border); border-radius: var(--radius-lg); box-shadow: var(--shadow-soft);
  }
  .metric-card { padding: 23px; min-height: 170px; position: relative; overflow: hidden; }
  .metric-card.hero { background: linear-gradient(135deg, rgba(54,66,143,.88), rgba(29,46,96,.95)); border-color: rgba(132,139,255,.35); }
  .metric-card.hero::after { content: "✦"; position: absolute; right: 30px; top: 24px; font-size: 54px; color: rgba(179,171,255,.38); }
  .metric-label { color: #aab5de; font-size: 13px; }
  .metric-value { margin-top: 20px; font-size: clamp(28px, 3.8vw, 48px); letter-spacing: -.035em; font-weight: 850; line-height: 1; word-break: break-word; }
  .metric-value.sm { font-size: clamp(24px, 2.5vw, 32px); }
  .metric-value.positive { color: var(--green); }
  .metric-value.negative { color: var(--red); }
  .metric-foot { color: var(--muted); font-size: 12px; margin-top: 14px; }

  .section-grid { display: grid; grid-template-columns: minmax(0, 1.15fr) minmax(360px, .85fr); gap: 18px; margin-top: 20px; }
  .section-card { padding: 22px; min-width: 0; }
  .section-head { display: flex; align-items: center; justify-content: space-between; gap: 18px; margin-bottom: 16px; }
  .section-title { margin: 0; font-size: 18px; letter-spacing: -.015em; }
  .section-subtitle { color: var(--muted); font-size: 12px; margin: 5px 0 0; }
  .text-link { border: 0; background: transparent; color: #b5a6ff; cursor: pointer; padding: 8px 0; font-weight: 700; }

  .chart-wrap { min-height: 280px; position: relative; display: grid; place-items: center; }
  .chart-svg { width: 100%; height: 250px; overflow: visible; }
  .chart-labels { display: flex; justify-content: space-between; gap: 8px; color: var(--muted-2); font-size: 10px; margin-top: -4px; }
  .chart-note { color: var(--muted-2); font-size: 11px; margin-top: 9px; }

  .movement-list { display: grid; gap: 10px; }
  .movement-row {
    width: 100%; border: 1px solid var(--border); background: rgba(16,24,52,.72); color: inherit;
    border-radius: 16px; display: grid; grid-template-columns: auto minmax(0,1fr) auto; align-items: center;
    gap: 13px; padding: 13px 14px; text-align: left; cursor: pointer; transition: transform var(--transition), border-color var(--transition), background var(--transition);
  }
  .movement-row:hover { transform: translateY(-1px); border-color: var(--border-strong); background: rgba(25,35,73,.9); }
  .movement-icon { width: 40px; height: 40px; border-radius: 12px; background: rgba(125,113,255,.16); display: grid; place-items: center; font-size: 17px; color: #d6d0ff; }
  .movement-main { min-width: 0; }
  .movement-title { font-weight: 800; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .movement-meta { color: var(--muted); font-size: 11px; margin-top: 4px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .movement-amount { font-weight: 850; white-space: nowrap; font-size: 14px; }
  .movement-amount.income { color: var(--green); }
  .movement-amount.expense { color: var(--red); }

  .account-mini-list { display: grid; gap: 10px; margin-top: 14px; }
  .account-mini { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 12px 0; border-bottom: 1px solid rgba(255,255,255,.06); }
  .account-mini:last-child { border-bottom: 0; }
  .account-mini strong { display: block; }
  .account-mini small { color: var(--muted); }

  .page-toolbar { display: flex; align-items: center; justify-content: space-between; gap: 14px; margin-bottom: 18px; flex-wrap: wrap; }
  .filters { display: flex; gap: 10px; flex-wrap: wrap; flex: 1; }
  .field-inline { position: relative; min-width: 180px; flex: 1 1 180px; max-width: 300px; }
  .field-inline svg { position: absolute; left: 13px; top: 50%; transform: translateY(-50%); width: 17px; height: 17px; color: var(--muted-2); pointer-events: none; }
  .field-inline input { padding-left: 40px; }

  .input, .select, .textarea {
    width: 100%; color: var(--text); background: #0d1636; border: 1px solid rgba(140,157,218,.34);
    border-radius: 13px; min-height: 46px; padding: 0 14px; transition: border-color var(--transition), box-shadow var(--transition), background var(--transition);
  }
  .textarea { min-height: 96px; padding: 12px 14px; resize: vertical; }
  .input:hover, .select:hover, .textarea:hover { border-color: rgba(157,171,235,.5); }
  .input:focus, .select:focus, .textarea:focus { border-color: #8d7fff; box-shadow: 0 0 0 3px rgba(125,113,255,.13); outline: 0; }
  .select { appearance: none; background-image: linear-gradient(45deg, transparent 50%, #aab5d9 50%), linear-gradient(135deg, #aab5d9 50%, transparent 50%); background-position: calc(100% - 18px) 20px, calc(100% - 13px) 20px; background-size: 5px 5px; background-repeat: no-repeat; padding-right: 38px; }
  .select option { background: #0d1636; color: #fff; }

  .account-grid { display: grid; grid-template-columns: repeat(3, minmax(0,1fr)); gap: 14px; }
  .account-card { padding: 19px; position: relative; overflow: hidden; }
  .account-card::after { content: ""; position: absolute; width: 90px; height: 90px; border-radius: 50%; right: -28px; bottom: -38px; background: rgba(125,113,255,.09); }
  .account-head { display: flex; align-items: center; gap: 12px; }
  .account-icon { width: 42px; height: 42px; border-radius: 13px; background: var(--primary-soft); display: grid; place-items: center; color: #bdb4ff; }
  .account-icon svg { width: 20px; height: 20px; }
  .account-name { font-weight: 850; }
  .account-type { color: var(--muted); font-size: 11px; margin-top: 3px; }
  .account-balance { margin-top: 24px; font-size: 25px; font-weight: 900; letter-spacing: -.025em; }
  .account-currency { color: var(--muted-2); font-size: 11px; margin-top: 4px; }

  .stats-grid { display: grid; grid-template-columns: repeat(4, minmax(0,1fr)); gap: 14px; }
  .stat-tile { padding: 18px; }
  .stat-tile .metric-value { margin-top: 12px; font-size: 24px; }
  .breakdown { display: grid; gap: 14px; }
  .breakdown-row { display: grid; grid-template-columns: minmax(110px, .9fr) minmax(130px, 1.8fr) auto; align-items: center; gap: 12px; }
  .breakdown-name { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .breakdown-bar { height: 8px; background: rgba(255,255,255,.06); border-radius: 999px; overflow: hidden; }
  .breakdown-fill { height: 100%; background: linear-gradient(90deg, #ff8294, #d9688d); border-radius: inherit; }
  .breakdown-value { color: var(--muted); font-size: 12px; white-space: nowrap; }

  .empty-state { padding: 48px 24px; text-align: center; border: 1px dashed rgba(150,164,238,.22); border-radius: var(--radius-lg); background: rgba(19,28,59,.44); }
  .empty-icon { width: 58px; height: 58px; margin: 0 auto 16px; border-radius: 18px; background: var(--primary-soft); display: grid; place-items: center; color: #bdb4ff; }
  .empty-icon svg { width: 27px; height: 27px; }
  .empty-state h3 { margin: 0; font-size: 18px; }
  .empty-state p { color: var(--muted); max-width: 460px; margin: 9px auto 20px; line-height: 1.6; }

  .settings-grid { display: grid; grid-template-columns: repeat(2, minmax(0,1fr)); gap: 14px; }
  .setting-row { padding: 19px; }
  .setting-row span { color: var(--muted); font-size: 12px; }
  .setting-row strong { display: block; margin-top: 7px; font-size: 17px; }

  .toast-region { position: fixed; top: 20px; right: 22px; z-index: 90; display: grid; gap: 10px; width: min(390px, calc(100vw - 32px)); pointer-events: none; }
  .toast { pointer-events: auto; border-radius: 15px; padding: 13px 14px; border: 1px solid var(--border); background: rgba(18,28,58,.96); box-shadow: var(--shadow); display: flex; align-items: flex-start; gap: 10px; animation: toastIn .22s ease; }
  @keyframes toastIn { from { opacity: 0; transform: translateY(-8px); } to { opacity: 1; transform: translateY(0); } }
  .toast.success { border-color: rgba(78,211,170,.28); }
  .toast.error { border-color: rgba(255,127,147,.28); }
  .toast.info { border-color: rgba(126,182,255,.28); }
  .toast-icon { width: 30px; height: 30px; border-radius: 9px; display: grid; place-items: center; flex: 0 0 30px; }
  .toast.success .toast-icon { background: var(--green-soft); color: var(--green); }
  .toast.error .toast-icon { background: var(--red-soft); color: var(--red); }
  .toast.info .toast-icon { background: rgba(126,182,255,.11); color: var(--info); }
  .toast-title { font-weight: 800; font-size: 13px; }
  .toast-text { color: var(--muted); font-size: 12px; margin-top: 2px; line-height: 1.4; }

  .modal-backdrop { position: fixed; inset: 0; z-index: 100; background: rgba(2,6,19,.74); backdrop-filter: blur(7px); display: grid; place-items: center; padding: 20px; animation: backdropIn .18s ease; }
  @keyframes backdropIn { from { opacity: 0; } to { opacity: 1; } }
  .modal { width: min(560px, 100%); max-height: min(84vh, 760px); overflow: auto; background: linear-gradient(180deg, #172142, #111936); border: 1px solid rgba(153,167,233,.28); border-radius: 24px; box-shadow: 0 30px 90px rgba(0,0,0,.48); animation: modalIn .2s ease; }
  @keyframes modalIn { from { opacity: 0; transform: translateY(10px) scale(.985); } to { opacity: 1; transform: translateY(0) scale(1); } }
  .modal-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 16px; padding: 22px 22px 14px; position: sticky; top: 0; background: rgba(23,33,66,.96); backdrop-filter: blur(12px); z-index: 2; }
  .modal-head h2 { margin: 0; font-size: 22px; }
  .modal-head p { margin: 5px 0 0; color: var(--muted); font-size: 12px; }
  .modal-body { padding: 10px 22px 22px; }
  .modal-actions { display: flex; justify-content: flex-end; gap: 10px; margin-top: 22px; flex-wrap: wrap; }
  .form-grid { display: grid; gap: 15px; }
  .field { display: grid; gap: 7px; }
  .field label { color: #dce1fb; font-size: 12px; font-weight: 700; }
  .field-help { color: var(--muted-2); font-size: 10px; }
  .form-row { display: grid; grid-template-columns: repeat(2, minmax(0,1fr)); gap: 12px; }
  .close-button { width: 38px; height: 38px; border-radius: 11px; border: 0; background: rgba(255,255,255,.05); display: grid; place-items: center; cursor: pointer; }
  .close-button svg { width: 19px; height: 19px; }
  .confirm-icon { width: 54px; height: 54px; border-radius: 16px; display: grid; place-items: center; margin-bottom: 16px; background: var(--red-soft); color: var(--red); }
  .confirm-icon svg { width: 25px; height: 25px; }

  .fab { position: fixed; right: 28px; bottom: 28px; width: 58px; height: 58px; border-radius: 19px; border: 0; background: linear-gradient(135deg, var(--primary), var(--primary-2)); color: #fff; display: grid; place-items: center; cursor: pointer; box-shadow: 0 18px 38px rgba(89,84,236,.34); z-index: 45; transition: transform var(--transition), filter var(--transition); }
  .fab:hover { transform: translateY(-2px); filter: brightness(1.08); }
  .fab:active { transform: translateY(0) scale(.97); }
  .fab svg { width: 24px; height: 24px; }
  .bottom-nav { display: none; }

  .skeleton-grid { display: grid; grid-template-columns: 1.5fr 1fr 1fr; gap: 16px; }
  .skeleton { min-height: 170px; border-radius: var(--radius-lg); background: linear-gradient(100deg, rgba(255,255,255,.04) 20%, rgba(255,255,255,.085) 38%, rgba(255,255,255,.04) 56%); background-size: 200% 100%; animation: shimmer 1.45s infinite linear; border: 1px solid rgba(255,255,255,.035); }
  .skeleton-wide { min-height: 280px; grid-column: span 2; }
  @keyframes shimmer { to { background-position-x: -200%; } }

  .error-state { padding: 44px 24px; text-align: center; }
  .error-state .empty-icon { color: var(--red); background: var(--red-soft); }

  @media (max-width: 1180px) {
    .dashboard-grid { grid-template-columns: minmax(0, 1.4fr) repeat(2, minmax(180px, .8fr)); }
    .section-grid { grid-template-columns: 1fr; }
    .account-grid { grid-template-columns: repeat(2, minmax(0,1fr)); }
    .stats-grid { grid-template-columns: repeat(2, minmax(0,1fr)); }
  }

  @media (max-width: 900px) {
    :root { --sidebar: 0px; }
    .sidebar { display: none; }
    .main-shell { margin-left: 0; padding: 18px 18px 116px; }
    .topbar { align-items: center; margin-bottom: 18px; flex-wrap: wrap; }
    .mobile-brand { display: flex; align-items: center; gap: 8px; font-size: 12px; letter-spacing: .12em; }
    .mobile-brand .brand-mark { font-size: 17px; }
    .page-heading { display: block; order: 3; flex: 0 0 100%; }
    .page-heading .eyebrow, .page-heading p { display: none; }
    .page-heading h1 { font-size: 26px; margin-top: 4px; }
    .mobile-settings { display: grid; }
    #headerAccount { min-height: 42px; padding: 0 13px; font-size: 12px; }
    .dashboard-grid { grid-template-columns: repeat(2, minmax(0,1fr)); }
    .metric-card.hero { grid-column: 1 / -1; }
    .metric-card { min-height: 145px; padding: 18px; }
    .metric-value { font-size: 34px; }
    .metric-value.sm { font-size: 25px; }
    .bottom-nav {
      display: grid; grid-template-columns: repeat(5, 1fr); position: fixed; left: 10px; right: 10px; bottom: calc(10px + env(safe-area-inset-bottom)); min-height: 70px;
      padding: 8px 5px; border: 1px solid rgba(150,164,238,.2); border-radius: 20px; background: rgba(11,17,40,.94); backdrop-filter: blur(18px); box-shadow: 0 16px 45px rgba(0,0,0,.34); z-index: 50;
    }
    .bottom-item { border: 0; background: transparent; color: #8d99c5; display: grid; place-items: center; gap: 4px; border-radius: 13px; min-width: 0; cursor: pointer; }
    .bottom-item svg { width: 20px; height: 20px; }
    .bottom-item small { font-size: 9px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 100%; }
    .bottom-item.active { color: #c5bbff; background: rgba(125,113,255,.12); }
    .fab { right: 22px; bottom: calc(94px + env(safe-area-inset-bottom)); width: 54px; height: 54px; border-radius: 18px; }
    .toast-region { top: auto; bottom: calc(96px + env(safe-area-inset-bottom)); right: 16px; left: 16px; width: auto; }
    .skeleton-grid { grid-template-columns: repeat(2, 1fr); }
    .skeleton-hero { grid-column: 1 / -1; }
    .skeleton-wide { grid-column: 1 / -1; }
  }

  @media (max-width: 640px) {
    .main-shell { padding-left: 14px; padding-right: 14px; }
    .dashboard-grid { gap: 10px; }
    .metric-card { min-height: 132px; padding: 15px; border-radius: 18px; }
    .metric-card.hero { min-height: 158px; }
    .metric-card.hero::after { right: 18px; top: 16px; font-size: 44px; }
    .metric-value { font-size: 30px; }
    .metric-value.sm { font-size: 20px; }
    .section-card { padding: 16px; border-radius: 18px; }
    .section-grid { gap: 12px; margin-top: 12px; }
    .section-title { font-size: 16px; }
    .chart-wrap { min-height: 220px; }
    .chart-svg { height: 205px; }
    .movement-row { grid-template-columns: auto minmax(0,1fr); }
    .movement-amount { grid-column: 2; justify-self: start; }
    .account-grid, .settings-grid, .stats-grid { grid-template-columns: 1fr; }
    .page-toolbar { align-items: stretch; }
    .filters { display: grid; grid-template-columns: 1fr 1fr; width: 100%; }
    .field-inline { min-width: 0; max-width: none; grid-column: 1 / -1; }
    .page-toolbar > .button { width: 100%; }
    .modal-backdrop { align-items: end; padding: 0; }
    .modal { width: 100%; max-height: min(90vh, 820px); border-radius: 24px 24px 0 0; border-bottom: 0; }
    .modal-head { padding: 20px 18px 13px; }

:root{

html,body{background:var(--ss-bg)!important;color:var(--ss-text);min-width:0;overflow-x:hidden}
body{
  background:
    radial-gradient(circle at 80% 0%,rgba(42,63,184,.22),transparent 31%),
    radial-gradient(circle at 24% 26%,rgba(30,78,171,.10),transparent 28%),
    linear-gradient(180deg,#03102c 0%,#02091d 55%,#010716 100%)!important;
}
body::before{
  content:"";position:fixed;inset:0;pointer-events:none;z-index:0;opacity:.52;
  background-image:
    radial-gradient(circle,#fff 0 1px,transparent 1.35px),
    radial-gradient(circle,#9ab6ff 0 1px,transparent 1.4px),
    radial-gradient(circle,#687eff 0 .8px,transparent 1.2px);
  background-size:113px 109px,171px 153px,79px 137px;
  background-position:15px 21px,61px 73px,112px 43px;
}
body::after{
  content:"";position:fixed;inset:0;pointer-events:none;z-index:0;
  background:linear-gradient(119deg,transparent 0 61%,rgba(74,93,255,.06) 61.2% 61.4%,transparent 61.6% 100%);
}

.cosmos-scene{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
.cosmos-scene .nebula{
  position:absolute;border-radius:50%;filter:blur(70px);opacity:.26;mix-blend-mode:screen
}
.nebula-left{width:430px;height:300px;left:-130px;bottom:8%;background:rgba(71,54,255,.46)}
.nebula-right{width:620px;height:380px;right:-220px;top:-70px;background:rgba(22,73,200,.38)}
.galaxy-haze{
  position:absolute;width:740px;height:170px;left:63%;top:7%;transform:translateX(-50%) rotate(-18deg);
  border-radius:50%;filter:blur(23px);opacity:.23;mix-blend-mode:screen;
  background:
    radial-gradient(ellipse at center,rgba(133,91,255,.42),transparent 24%),
    linear-gradient(90deg,transparent,rgba(51,92,255,.28),rgba(126,77,255,.42),rgba(43,93,255,.22),transparent)
}
.constellation-map{position:absolute;filter:drop-shadow(0 0 6px rgba(70,111,255,.5))}
.constellation-map-a{width:600px;height:430px;right:-42px;top:-28px;opacity:.75}
.constellation-map-b{width:520px;height:520px;left:-150px;bottom:-130px;opacity:.46}
.constellation-map-c{width:720px;height:340px;right:14%;bottom:-120px;opacity:.22}
.constellation-lines{fill:none;stroke:#476fd6;stroke-width:1.2}
.constellation-stars{fill:#dce7ff}
.constellation-stars circle{filter:drop-shadow(0 0 6px #5b83ff)}
.cosmic-orbit{position:absolute;border-radius:50%;border:1px solid rgba(92,82,255,.16);transform:rotate(-16deg)}

/* ---------- Sidebar / logo ---------- */

/* ---------- Donuts with real hover targets ---------- */
.ss82-donut-shell{min-height:172px}
.ss82-donut-layout{display:grid;grid-template-columns:145px minmax(0,1fr);align-items:center;gap:12px}
.ss82-donut-graphic{width:138px;height:138px;position:relative}
.ss82-donut-svg{width:100%;height:100%;overflow:visible}
.ss82-donut-track{stroke:#0c2a60}
.ss82-donut-segment{cursor:pointer;transition:stroke-width .16s ease,filter .16s ease}
.ss82-donut-segment:hover,.ss82-donut-segment.chart-point-active{stroke-width:22;filter:drop-shadow(0 0 5px rgba(120,87,255,.4))}
.ss82-donut-center{position:absolute;inset:0;display:grid;place-content:center;text-align:center;pointer-events:none}
.ss82-donut-center strong{font-size:12px;max-width:98px;overflow:hidden;text-overflow:ellipsis}
.ss82-donut-center small{font-size:8px;color:#9cadcf;margin-top:3px}
.ss82-donut-legend{display:grid;gap:7px}
.ss82-legend-row{
  border:0;background:transparent;color:inherit;display:grid;grid-template-columns:9px minmax(0,1fr) 30px auto;
  align-items:center;gap:6px;text-align:left;padding:1px 0;cursor:pointer
}
.ss82-legend-row i{width:8px;height:8px;border-radius:50%;background:var(--legend-color)}
.ss82-legend-row span{font-size:9px;color:#b0bee1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ss82-legend-row b{font-size:9px;color:#d5ddf3;text-align:right}
.ss82-legend-row small{font-size:8px;color:#8799c3;white-space:nowrap}
.f8-donut-empty{min-height:150px;display:grid;place-content:center;text-align:center;gap:4px;color:#91a4ce}
.f8-donut-empty strong{color:#fff;font-size:12px}.f8-donut-empty small{font-size:9px;max-width:220px}

/* ====================== HOME ====================== */
.ss82-home{display:grid;gap:10px}
.ss82-metrics{display:grid;grid-template-columns:1.15fr .93fr .93fr .93fr;gap:10px}
.ss82-balance-card,.ss82-metric{min-height:105px;position:relative;overflow:hidden}
.ss82-balance-card{
  padding:14px 16px!important;border-color:#3474ff!important;
  background:radial-gradient(circle at 84% 35%,rgba(48,78,255,.36),transparent 34%),linear-gradient(145deg,#0a3177,#061b49 62%,#06163b)!important
}
.ss82-planet{
  position:absolute;right:-50px;bottom:-87px;width:205px;height:150px;border-radius:50%;
  background:radial-gradient(circle at 37% 30%,#4b6cff 0,#253fc4 22%,#0c216f 50%,#050f39 70%);
  box-shadow:-20px -18px 36px rgba(78,67,255,.31),inset 12px 11px 27px rgba(81,113,255,.34);opacity:.86
}
.ss82-planet::after{
  content:"";position:absolute;left:-12%;top:24%;width:126%;height:13%;border-radius:50%;
  border-top:3px solid rgba(116,83,255,.95);transform:rotate(-12deg);filter:drop-shadow(0 0 8px #684eff)
}
.ss82-card-label{position:relative;z-index:2;display:flex;align-items:center;gap:8px;font-size:11px;color:#dce6ff}
.ss82-eye{opacity:.62}
.ss82-balance-value{display:block;position:relative;z-index:2;font-size:28px;line-height:1;margin:7px 0 4px;letter-spacing:-.025em}
.ss82-balance-meta{position:relative;z-index:2;font-size:8.5px;color:#27dfab}
.ss82-mobile-metrics{display:none}
.ss82-metric{padding:13px!important;display:grid;grid-template-columns:auto minmax(0,1fr) auto;align-items:center;gap:10px}
.ss82-metric-icon{width:43px;height:43px;border-radius:50%;display:grid;place-items:center;font-size:27px}
.ss82-metric>div{display:grid;gap:2px;min-width:0}.ss82-metric small{font-size:9.5px;color:#a5b7dc}.ss82-metric strong{font-size:18px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ss82-metric.income{border-color:rgba(26,211,159,.57)!important;background:linear-gradient(145deg,rgba(5,60,70,.96),rgba(4,27,58,.98))!important}.ss82-metric.income .ss82-metric-icon{background:rgba(17,213,160,.26);color:#26ecb2}.ss82-metric.income strong{color:#28e7ae}
.ss82-metric.expense{border-color:rgba(238,59,117,.57)!important;background:linear-gradient(145deg,rgba(68,20,58,.95),rgba(31,15,48,.98))!important}.ss82-metric.expense .ss82-metric-icon{background:rgba(235,56,112,.26);color:#ff4f80}.ss82-metric.expense strong{color:#ff4d7d}
.ss82-metric.savings{border-color:rgba(226,178,52,.57)!important;background:linear-gradient(145deg,rgba(61,49,29,.95),rgba(29,24,42,.98))!important}.ss82-metric.savings .ss82-metric-icon{background:rgba(232,184,57,.22);color:#ffd25c}.ss82-metric.savings strong{color:#ffd25c}
.ss82-bars{width:29px;height:30px;align-self:end;background:linear-gradient(90deg,transparent 0 8%,currentColor 8% 18%,transparent 18% 30%,currentColor 30% 42%,transparent 42% 54%,currentColor 54% 67%,transparent 67% 80%,currentColor 80% 94%);opacity:.24}
.ss82-metric.income .ss82-bars{color:#2ae9b2}.ss82-metric.expense .ss82-bars{color:#ff507e}.ss82-metric.savings .ss82-bars{color:#ffd05a}

.ss82-chart-row{display:grid;grid-template-columns:minmax(0,1.55fr) minmax(300px,.78fr);gap:10px}
.ss82-chart-panel,.ss82-donut-panel{min-height:215px}
.ss82-chart-panel .premium-chart-shell{min-height:168px}.ss82-chart-panel .premium-finance-svg{height:168px}
.chart-range-select{width:auto!important;min-height:32px!important;height:32px!important;padding:0 31px 0 11px!important;border-radius:999px!important;font-size:9px!important}
.ss82-donut-panel .ss82-donut-layout{min-height:164px}

.ss82-dashboard-grid{
  display:grid;grid-template-columns:minmax(0,1.55fr) minmax(290px,.67fr);
  grid-template-areas:"goals planning" "recent side";gap:10px
}
.ss82-goals-panel{grid-area:goals;min-width:0}
.ss82-planning-panel{grid-area:planning;min-width:0}
.ss82-recent-panel{grid-area:recent;min-width:0}
.ss82-side-stack{grid-area:side;display:grid;grid-template-rows:auto auto;gap:10px;min-width:0}
.ss82-goal-mini-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.ss82-goal-mini-grid.count-1{grid-template-columns:minmax(0,1fr)}
.ss82-goal-mini-grid.count-2{grid-template-columns:repeat(2,minmax(0,1fr))}
.ss82-goal-mini{
  border:1px solid rgba(54,110,219,.5);border-radius:12px;background:linear-gradient(145deg,rgba(7,34,78,.98),rgba(4,23,58,.98));
  padding:9px;color:inherit;text-align:left;display:grid;grid-template-columns:38px minmax(0,1fr);gap:8px;min-width:0;cursor:pointer
}
.ss82-goal-mini.completed{border-color:rgba(255,203,73,.72);box-shadow:0 0 16px rgba(224,170,44,.16)}
.ss82-goal-icon{width:38px;height:38px;border-radius:10px;display:grid;place-items:center;background:linear-gradient(145deg,#1957d5,#1a2677);font-size:19px}
.ss82-goal-copy{min-width:0}.ss82-goal-copy>strong{font-size:10px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.ss82-goal-copy>small{display:block;font-size:8px;margin-top:3px;color:#d2dcf5;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.ss82-goal-copy>small em{font-style:normal;color:#8ea1ca}
.ss82-goal-mini .f8-progress-wrap{margin-top:5px!important}.ss82-goal-left{display:block;font-size:7.5px;margin-top:4px;color:#aab9da;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.ss82-goal-left i{font-style:normal;color:#ffd05a;margin-right:5px}
.ss82-planning-panel>small{font-size:9px;color:#93a6d0}.ss82-planning-panel>strong{display:block;margin:5px 0 1px;font-size:18px}.ss82-planning-panel>strong em{font-style:normal;font-size:10px;color:#8d96c6}.ss82-planning-foot{display:flex;gap:6px;align-items:center;margin-top:8px;font-size:8.5px;color:#a7b4d6}
.ss82-section-actions{display:flex;align-items:center;gap:8px}
.ss82-recent-list{gap:0!important}
.ss82-recent-list .movement-row{
  min-height:39px!important;border:0!important;border-bottom:1px solid rgba(64,103,180,.22)!important;border-radius:0!important;
  background:transparent!important;padding:6px 6px!important;grid-template-columns:30px minmax(0,1fr) auto!important
}
.ss82-recent-list .movement-row:last-child{border-bottom:0!important}
.ss82-recent-list .movement-icon{width:28px!important;height:28px!important;border-radius:8px!important}
.ss82-recent-list .movement-title{font-size:9.5px!important}.ss82-recent-list .movement-meta{font-size:7.5px!important}.ss82-recent-list .movement-amount{font-size:9px!important}
.ss82-account-mini-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.ss82-account-mini-grid.count-1{grid-template-columns:1fr}.ss82-account-mini-grid.count-2{grid-template-columns:repeat(2,1fr)}
.ss82-accounts-panel .f8-account-mini{
  border:1px solid rgba(56,110,214,.43)!important;border-radius:10px!important;background:rgba(5,31,73,.86)!important;
  padding:6px!important;display:grid!important;grid-template-columns:28px minmax(0,1fr)!important;gap:5px!important;align-items:center!important;color:inherit!important;text-align:left!important
}
.ss82-accounts-panel .f8-account-mini-icon{width:28px!important;height:28px!important;border-radius:8px!important;background:#173fb0!important}
.ss82-accounts-panel .f8-account-mini small{font-size:7px!important;color:#aebadd!important;white-space:nowrap!important;overflow:hidden!important;text-overflow:ellipsis!important}
.ss82-accounts-panel .f8-account-mini strong{font-size:8px!important;white-space:nowrap!important;overflow:hidden!important;text-overflow:ellipsis!important}
.ss82-encouragement{min-height:64px;padding:10px 12px!important;display:grid;grid-template-columns:auto 1fr auto;gap:9px;align-items:center;border-color:rgba(223,177,57,.55)!important;background:linear-gradient(130deg,rgba(58,48,31,.78),rgba(8,26,57,.94))!important}
.ss82-encouragement>span:first-child{font-size:23px}.ss82-encouragement strong{font-size:10px}.ss82-encouragement small{display:block;font-size:7.5px;color:#aeb9d8;margin-top:2px}.ss82-chevron{color:#ffd05a!important;font-size:24px!important}
.ss82-empty-inline{min-height:70px;display:flex;align-items:center;justify-content:center;gap:10px;color:#aab8d8}.ss82-empty-inline>span{color:#8066ff;font-size:22px}.ss82-empty-inline>div{display:grid;gap:2px}.ss82-empty-inline strong{font-size:10px;color:#fff}.ss82-empty-inline small{font-size:8px}.ss82-empty-inline.compact{min-height:52px}

/* ====================== MOVEMENTS ====================== */
.ss82-movement-summary{display:grid;grid-template-columns:1.05fr 1fr 1fr;gap:9px;margin-bottom:9px}
.ss82-summary-card{min-height:78px;padding:11px 13px!important;display:grid;grid-template-columns:auto minmax(0,1fr) auto;align-items:center;gap:10px}
.ss82-summary-card>span:first-child{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;font-size:24px}
.ss82-summary-card small{font-size:8.5px;color:#9badcf}.ss82-summary-card strong{display:block;font-size:17px;margin-top:3px}
.ss82-summary-card.income{border-color:rgba(24,211,160,.53)!important}.ss82-summary-card.income>span{background:rgba(21,215,161,.2);color:#26e8ae}.ss82-summary-card.income strong{color:#25e2aa}
.ss82-summary-card.expense{border-color:rgba(239,64,121,.54)!important}.ss82-summary-card.expense>span{background:rgba(239,58,116,.2);color:#ff507d}.ss82-summary-card.expense strong{color:#ff507d}
.ss82-summary-card>i{width:27px;height:29px;opacity:.2;background:linear-gradient(90deg,transparent 0 10%,currentColor 10% 22%,transparent 22% 34%,currentColor 34% 47%,transparent 47% 60%,currentColor 60% 73%,transparent 73% 84%,currentColor 84% 96%)}
.ss82-summary-card.income>i{color:#25e2aa}.ss82-summary-card.expense>i{color:#ff507d}
.ss82-movement-controls{padding:10px!important;margin-bottom:9px}
.ss82-type-tabs{display:inline-flex;padding:3px;background:#061632;border:1px solid rgba(56,103,198,.38);border-radius:10px;gap:3px}
.ss82-type-tabs button{border:0;background:transparent;color:#8fa3d1;padding:7px 16px;border-radius:8px;font-size:9px;cursor:pointer}
.ss82-type-tabs button.active{background:linear-gradient(90deg,#7146ff,#5549f7);color:#fff}
.ss82-filter-row{display:grid;grid-template-columns:minmax(190px,1.4fr) repeat(3,minmax(120px,.72fr)) auto;gap:7px;margin-top:9px}
.ss82-filter-row .field-inline{min-width:0!important;max-width:none!important}
.ss82-filter-row .input,.ss82-filter-row .select{min-height:36px!important;height:36px!important;font-size:9px!important}
.ss82-control-actions{display:flex;gap:6px}.ss82-control-actions .button{min-height:36px!important;height:36px!important;padding:0 10px!important;font-size:9px!important}
.ss82-mobile-filters{display:none}
.ss82-history-card{padding:12px!important}.ss82-movement-list{gap:0!important}
.ss82-movement-list .movement-row{
  min-height:47px!important;border:0!important;border-bottom:1px solid rgba(65,104,184,.25)!important;border-radius:0!important;
  background:transparent!important;padding:6px 7px!important;grid-template-columns:32px minmax(0,1fr) auto!important
}
.ss82-movement-list .movement-row:hover{background:rgba(12,41,86,.44)!important;transform:none!important}
.ss82-movement-list .movement-icon{width:30px!important;height:30px!important;border-radius:9px!important}.ss82-movement-list .movement-title{font-size:10px!important}.ss82-movement-list .movement-meta{font-size:7.8px!important}.ss82-movement-list .movement-amount{font-size:9.5px!important}
.ss82-mobile-new-movement{display:none!important}
.ss82-receipts-panel{margin-top:9px!important}

/* ====================== ACCOUNTS ====================== */
.ss82-account-hero{
  position:relative;overflow:hidden;padding:15px 16px!important;margin-bottom:11px;min-height:146px;
  background:radial-gradient(circle at 88% 28%,rgba(47,75,255,.36),transparent 35%),linear-gradient(145deg,#0a3178,#061b48 68%)!important;border-color:#3574ff!important
}
.ss82-account-hero>strong{display:block;position:relative;z-index:2;font-size:32px;margin:8px 0 3px;letter-spacing:-.03em}
.ss82-account-hero>small{font-size:8.5px;color:#96a9d2;position:relative;z-index:2}
.ss82-account-actions{position:relative;z-index:2;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:13px}
.ss82-account-actions button{min-height:41px;border:1px solid rgba(74,123,218,.45);background:rgba(5,28,66,.68);color:#dce6ff;border-radius:10px;display:flex;align-items:center;justify-content:center;gap:6px;font-size:9px;cursor:pointer}
.ss82-section-title-row{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:0 3px 9px}.ss82-section-title-row h2{font-size:16px;margin:0}.ss82-section-title-row span{font-size:8.5px;color:#8094be}
.ss82-account-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:9px}
.ss82-account-card{min-height:133px;padding:12px!important;overflow:hidden;position:relative;text-align:left;color:inherit;cursor:pointer}
.ss82-account-card::after{content:"";position:absolute;left:10%;right:10%;bottom:13px;height:3px;transform:skewX(-28deg);background:linear-gradient(90deg,transparent,#25d7b4 18% 34%,transparent 35% 43%,#25d7b4 44% 67%,transparent 68% 76%,#25d7b4 77% 92%,transparent)}
.ss82-account-card.tone-index-1::after{background:linear-gradient(90deg,transparent,#6c60ff 18% 34%,transparent 35% 43%,#6c60ff 44% 67%,transparent 68% 76%,#6c60ff 77% 92%,transparent)}
.ss82-account-card.tone-index-2::after{background:linear-gradient(90deg,transparent,#ff4f78 18% 34%,transparent 35% 43%,#ff4f78 44% 67%,transparent 68% 76%,#ff4f78 77% 92%,transparent)}
.ss82-account-card.tone-index-3::after{background:linear-gradient(90deg,transparent,#ffd05a 18% 34%,transparent 35% 43%,#ffd05a 44% 67%,transparent 68% 76%,#ffd05a 77% 92%,transparent)}
.ss82-account-card-head{display:grid;grid-template-columns:38px minmax(0,1fr) auto;align-items:center;gap:8px}.ss82-account-card-head>div{min-width:0}.ss82-account-card-head strong{font-size:10px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.ss82-account-card-head small{display:block;font-size:7.5px;color:#91a4cb;margin-top:2px}.ss82-account-card-head b{font-size:12px;color:#90a2cb;letter-spacing:1px}
.ss82-account-icon{width:38px;height:38px;border-radius:10px;display:grid;place-items:center;background:rgba(91,71,255,.25);color:#d6d2ff}.tone-cash .ss82-account-icon{background:rgba(20,210,157,.2);color:#32e8b2}.tone-savings .ss82-account-icon{background:rgba(168,76,255,.22);color:#d59cff}
.ss82-account-card-balance{font-size:20px;font-weight:850;margin-top:14px;letter-spacing:-.025em}.ss82-account-card-foot{display:flex;align-items:center;gap:8px;margin-top:5px;font-size:7.5px;color:#7f94c2}.ss82-account-streak{flex:1}
.ss82-add-account-card{min-height:133px;border:1px dashed rgba(75,124,218,.48);border-radius:15px;background:rgba(4,25,58,.46);color:#95a9d3;display:grid;place-items:center;align-content:center;gap:7px;cursor:pointer}.ss82-add-account-card>span{width:35px;height:35px;border-radius:50%;display:grid;place-items:center;background:rgba(101,72,255,.17);color:#9d82ff}.ss82-add-account-card strong{font-size:10px}.ss82-add-account-card small{display:block;font-size:8px;margin-top:2px}
.ss82-accounts-bottom{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}.ss82-money-distribution,.ss82-account-recent{min-width:0}.ss82-money-distribution .ss82-donut-layout{grid-template-columns:150px 1fr}.ss82-account-recent .ss82-recent-list .movement-row{min-height:43px!important}

/* ====================== GOALS ====================== */
.ss82-goals-hero{display:grid;grid-template-columns:minmax(0,1.55fr) minmax(260px,.65fr);gap:10px;margin-bottom:10px}
.ss82-goals-total{position:relative;overflow:hidden;min-height:158px;padding:15px!important;background:radial-gradient(circle at 84% 35%,rgba(48,77,255,.34),transparent 35%),linear-gradient(145deg,#0a3176,#061a47 68%)!important;border-color:#3473ff!important}
.ss82-goals-total-value{display:flex;align-items:baseline;gap:6px;margin-top:12px;position:relative;z-index:2}.ss82-goals-total-value strong{font-size:28px}.ss82-goals-total-value span{font-size:9px;color:#94a7d1}
.ss82-goals-total>.f8-progress-wrap{position:relative;z-index:2;margin-top:13px!important}
.ss82-goals-metrics{position:relative;z-index:2;display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:9px}.ss82-goals-metrics span{display:grid}.ss82-goals-metrics b{font-size:10px}.ss82-goals-metrics small{font-size:7.5px;color:#91a4cd}
.ss82-goals-ring-card{display:grid;grid-template-columns:118px 1fr;align-items:center;gap:12px;padding:12px!important}
.ss82-goal-ring{width:112px;aspect-ratio:1;border-radius:50%;padding:14px;background:conic-gradient(#7451ff calc(var(--pct)*1%),#0c2b5f 0);display:grid;place-items:center}.ss82-goal-ring::before{content:"";grid-area:1/1;width:100%;height:100%;border-radius:50%;background:#061a40;box-shadow:inset 0 0 0 1px rgba(73,111,190,.28)}.ss82-goal-ring>div{grid-area:1/1;z-index:1;text-align:center}.ss82-goal-ring strong{font-size:20px}.ss82-goal-ring small{display:block;font-size:8px;color:#91a4ca}
.ss82-ring-stats{display:grid;grid-template-columns:auto 1fr;gap:5px 9px;align-items:center}.ss82-ring-stats span{display:contents}.ss82-ring-stats strong{font-size:16px}.ss82-ring-stats small{font-size:8px;color:#96a7cd}
.ss82-goal-tabs{display:flex;align-items:center;justify-content:space-between;margin-bottom:9px}.ss82-goal-tabs>div{display:flex;gap:6px}.ss82-goal-tabs button{border:1px solid rgba(64,112,204,.44);background:#061731;color:#91a4cf;min-height:33px;padding:0 13px;border-radius:9px;font-size:9px;cursor:pointer}.ss82-goal-tabs button.active{background:linear-gradient(95deg,#7249ff,#5448f7);color:#fff;border-color:transparent}.ss82-goal-tabs>span{font-size:8px;color:#7f93bd}
.ss82-goal-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:9px}
.ss82-goal-card{min-height:122px;padding:11px!important;display:grid;grid-template-columns:40px minmax(0,1fr);gap:9px;text-align:left;color:inherit;cursor:pointer}.ss82-goal-card.completed{border-color:rgba(255,201,71,.64)!important}
.ss82-goal-card-icon{width:40px;height:40px;border-radius:11px;display:grid;place-items:center;background:linear-gradient(145deg,#1754d0,#182572);font-size:20px}
.ss82-goal-card-copy{min-width:0}.ss82-goal-card-head{display:flex;align-items:center;gap:7px}.ss82-goal-card-head strong{font-size:10px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.ss82-goal-card-head em{margin-left:auto;font-style:normal;font-size:7px!important}.ss82-goal-card-copy>small{font-size:7.5px;color:#91a4ca}.ss82-goal-card-money{display:flex;align-items:baseline;gap:4px;margin-top:7px}.ss82-goal-card-money strong{font-size:13px}.ss82-goal-card-money em{font-style:normal;font-size:8px;color:#8d9ec7}.ss82-goal-card-foot{display:flex;align-items:center;justify-content:space-between;font-size:7.5px;color:#aab8d7;margin-top:4px}
.ss82-mobile-primary{display:none!important}

/* ============================================================
   STAR STREAM v0.8.3 · POLISH PASS
   Correcciones directas de las capturas reales del usuario:
   - balance móvil sin solapamientos
   - cuentas del inicio legibles
   - grids que no se salen de pantalla
   - galaxia/constelaciones más ricas, sin planetas planos gigantes
   - decoración de métricas y cuentas refinada
   - microinteracciones premium y ligeras
   ============================================================ */

/* ---------- Fondo espacial: nebulosa + galaxia, no discos planos gigantes ---------- */
body{
  background:
    radial-gradient(ellipse at 82% 2%,rgba(50,77,210,.30),transparent 30%),
    radial-gradient(ellipse at 18% 78%,rgba(92,54,220,.15),transparent 31%),
    radial-gradient(ellipse at 54% 44%,rgba(20,64,145,.10),transparent 36%),
    linear-gradient(180deg,#020b22 0%,#02091d 48%,#010716 100%)!important;
}
body::before{
  opacity:.68!important;
  background-image:
    radial-gradient(circle,#fff 0 1px,transparent 1.45px),
    radial-gradient(circle,#9ab8ff 0 1px,transparent 1.45px),
    radial-gradient(circle,#7768ff 0 .9px,transparent 1.35px),
    radial-gradient(circle,#d5e5ff 0 .65px,transparent 1.15px)!important;
  background-size:109px 103px,167px 149px,73px 131px,211px 187px!important;
  animation:ss83-star-drift 42s linear infinite alternate;
}
.cosmos-scene{overflow:hidden;background:
  radial-gradient(ellipse at 65% 17%,rgba(55,92,220,.10),transparent 33%),
  radial-gradient(ellipse at 10% 70%,rgba(95,55,220,.08),transparent 27%)}
.cosmos-scene::before{
  width:112vw!important;height:290px!important;aspect-ratio:auto!important;right:-28vw!important;top:20%!important;
  border-radius:50%!important;opacity:.30!important;transform:rotate(-17deg)!important;
  background:
    radial-gradient(ellipse at 50% 50%,rgba(244,248,255,.16) 0 1.2%,transparent 2%),
    radial-gradient(ellipse at 48% 50%,rgba(139,111,255,.28),transparent 14%),
    radial-gradient(ellipse at 52% 50%,rgba(62,117,255,.25),transparent 31%),
    linear-gradient(90deg,transparent 1%,rgba(54,88,255,.06) 21%,rgba(126,80,255,.20) 49%,rgba(51,111,255,.09) 76%,transparent 99%)!important;
  box-shadow:none!important;filter:blur(16px) saturate(1.2)!important;
  animation:ss83-galaxy-drift 24s ease-in-out infinite alternate;
}
.cosmos-scene::after{
  width:78vw!important;height:210px!important;left:-24vw!important;bottom:4%!important;right:auto!important;top:auto!important;
  border-radius:50%!important;opacity:.20!important;transform:rotate(10deg)!important;
  background:
    radial-gradient(ellipse at 52% 47%,rgba(130,86,255,.24),transparent 22%),
    radial-gradient(ellipse at 45% 55%,rgba(31,98,230,.20),transparent 48%),
    linear-gradient(90deg,transparent,rgba(64,61,229,.12),transparent)!important;
  box-shadow:none!important;filter:blur(22px)!important;
  animation:ss83-nebula-drift 30s ease-in-out infinite alternate;
}
.galaxy-haze{
  width:min(76vw,1120px)!important;height:210px!important;left:61%!important;top:4%!important;opacity:.34!important;
  filter:blur(20px) saturate(1.25)!important;
  background:
    radial-gradient(ellipse at 48% 48%,rgba(255,255,255,.16) 0 1%,transparent 2%),
    radial-gradient(ellipse at 50% 50%,rgba(154,107,255,.30),transparent 18%),
    radial-gradient(ellipse at 50% 50%,rgba(47,107,255,.22),transparent 42%),
    linear-gradient(90deg,transparent,rgba(64,93,255,.14),rgba(125,77,255,.22),rgba(48,104,255,.12),transparent)!important;
  animation:ss83-galaxy-drift 27s ease-in-out infinite alternate;
}
.nebula{animation:ss83-nebula-drift 28s ease-in-out infinite alternate}
.constellation-map{will-change:transform,opacity}
.constellation-map-a{animation:ss83-constellation-a 18s ease-in-out infinite alternate}
.constellation-map-b{animation:ss83-constellation-b 22s ease-in-out infinite alternate}
.constellation-map-c{animation:ss83-constellation-a 26s ease-in-out infinite alternate-reverse}
.constellation-lines{stroke:#5d82e8!important;stroke-width:1.15!important;opacity:.62}
.constellation-stars circle{animation:ss83-twinkle 3.8s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
.constellation-stars circle:nth-child(3n){animation-delay:.8s}.constellation-stars circle:nth-child(3n+1){animation-delay:1.55s}
.cosmic-orbit{opacity:.34!important;animation:ss83-orbit-breathe 9s ease-in-out infinite alternate}

/* Planetita de las tarjetas hero: más atmosférica y menos “círculo plano”. */
.ss82-planet,.ss81-planet{
  overflow:visible!important;opacity:.92!important;
  background:
    radial-gradient(circle at 31% 24%,rgba(210,230,255,.42) 0 1.3%,transparent 1.7%),

    radial-gradient(circle at 68% 57%,rgba(30,50,133,.68) 0 8%,transparent 9%),
    radial-gradient(circle at 38% 35%,rgba(96,97,255,.58),transparent 28%),
    radial-gradient(circle at 52% 52%,#214fc8 0 20%,#112f8b 43%,#071c58 67%,#03112f 100%)!important;

    inset -48px -20px 70px rgba(0,4,25,.84)!important;

.ss82-planet::before,.ss81-planet::before{

    radial-gradient(ellipse at 45% 50%,rgba(164,184,255,.16),transparent 58%);

.ss82-planet::after,.ss81-planet::after{
  height:10%!important;top:31%!important;left:-17%!important;width:135%!important;border:0!important;

  transform:rotate(-11deg)!important;filter:blur(.15px) drop-shadow(0 0 7px rgba(105,77,255,.75))!important

/* ============================================================
   STAR STREAM v0.8.4 · GALAXY MOTION + MOBILE FIT PASS
   Correcciones solicitadas sobre v0.8.3:
   - sin planetas ni puntos decorativos dentro de tarjetas
   - galaxia/constelaciones más vivas + estrellas fugaces
   - animaciones visibles pero ligeras
   - cuentas del Inicio móvil apiladas y legibles
   - tarjetas de Planificación contenidas dentro del viewport
   - Evolución financiera aprovecha todo el ancho disponible
   - retiro del bloque dorado de felicitación
   ============================================================ */

/* ---------- Quitar por completo los planetas ---------- */
.ss82-planet,.ss81-planet{display:none!important}

/* ---------- Fondo galáctico más profundo, sin esferas planas ---------- */
body{
  background:
    radial-gradient(ellipse at 76% -6%,rgba(69,94,255,.25),transparent 30%),
    radial-gradient(ellipse at 18% 43%,rgba(94,47,205,.14),transparent 34%),
    radial-gradient(ellipse at 89% 78%,rgba(22,104,211,.12),transparent 29%),
    linear-gradient(180deg,#020a20 0%,#020819 46%,#010512 100%)!important;
}
.cosmos-scene{
  background:
    radial-gradient(ellipse at 68% 11%,rgba(72,102,245,.12),transparent 29%),
    radial-gradient(ellipse at 20% 78%,rgba(112,55,231,.10),transparent 31%),
    radial-gradient(ellipse at 88% 64%,rgba(31,87,194,.08),transparent 25%)!important;
}
.cosmos-scene::before{
  width:132vw!important;height:310px!important;right:-32vw!important;top:10%!important;
  border-radius:48% 52% 52% 48%/58% 42% 58% 42%!important;
  opacity:.38!important;transform:rotate(-15deg)!important;
  background:
    radial-gradient(ellipse at 50% 50%,rgba(255,255,255,.18) 0 .8%,transparent 1.7%),
    radial-gradient(ellipse at 50% 50%,rgba(179,132,255,.26),transparent 11%),
    radial-gradient(ellipse at 47% 54%,rgba(68,113,255,.23),transparent 30%),
    linear-gradient(90deg,transparent 2%,rgba(68,101,255,.04) 16%,rgba(132,78,255,.20) 46%,rgba(54,128,255,.10) 72%,transparent 98%)!important;
  filter:blur(17px) saturate(1.35)!important;
  box-shadow:none!important;
  animation:ss84-galaxy-sway 20s ease-in-out infinite alternate!important;
}
.cosmos-scene::after{
  width:98vw!important;height:240px!important;left:-22vw!important;bottom:4%!important;
  border-radius:50%!important;opacity:.24!important;transform:rotate(9deg)!important;
  background:
    radial-gradient(ellipse at 48% 50%,rgba(157,93,255,.23),transparent 20%),
    radial-gradient(ellipse at 54% 48%,rgba(38,112,239,.16),transparent 46%),
    linear-gradient(90deg,transparent,rgba(69,69,229,.10),rgba(112,65,225,.16),transparent)!important;
  filter:blur(25px) saturate(1.2)!important;box-shadow:none!important;
  animation:ss84-nebula-float 24s ease-in-out infinite alternate!important;
}
.galaxy-haze{
  opacity:.42!important;filter:blur(17px) saturate(1.45)!important;
  animation:ss84-galaxy-sway 25s ease-in-out infinite alternate-reverse!important;
}
.nebula-left,.nebula-right{opacity:.58!important;animation:ss84-nebula-float 18s ease-in-out infinite alternate!important}
.constellation-lines{
  stroke:#658cf2!important;stroke-width:1.2!important;opacity:.63!important;
  stroke-dasharray:10 5;animation:ss84-constellation-flow 12s linear infinite
}
.constellation-stars circle{animation:ss84-star-breathe 3.2s ease-in-out infinite!important}
.constellation-stars circle:nth-child(2n){animation-delay:.9s!important}.constellation-stars circle:nth-child(3n){animation-delay:1.7s!important}

/* Estrellas fugaces: visibles de verdad, sin cargar imágenes. */
.shooting-star{
  position:absolute;z-index:3;display:block;width:190px;height:2px;left:108%;top:14%;opacity:0;
  border-radius:999px;pointer-events:none;transform:rotate(-24deg);
  background:linear-gradient(90deg,transparent 0%,rgba(103,155,255,.18) 20%,rgba(142,195,255,.9) 70%,#fff 100%);
  box-shadow:0 0 9px rgba(102,148,255,.75),0 0 22px rgba(94,72,255,.34);
  will-change:transform,opacity
}
.shooting-star-a{animation:ss84-shoot-a 8.5s ease-in infinite}
.shooting-star-b{top:42%;width:145px;animation:ss84-shoot-b 12s 3.4s ease-in infinite}
.shooting-star-c{top:69%;width:125px;animation:ss84-shoot-c 15s 6.2s ease-in infinite}
