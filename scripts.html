      } else {
        const movement = state.data?.movimientos?.find(m => String(m.id) === String(entryBtn.dataset.entryId));
        if (movement) {
          const account = accountById(movement.cuentaId);
          if (account?.activa === false) {
            showToast('Movimiento histórico.', 'Reactiva la cuenta antes de editar este movimiento.', 'info');
          } else {
            openMovementModal(movement);
          }
        }
      }
      return;

    const accountBtn = event.target.closest('[data-account-id]');
    if (accountBtn) {
      const account = accountById(accountBtn.dataset.accountId);
      if (account) openAccountDetail(account);
      return;
    }

    const categoryBtn = event.target.closest('[data-category-id]');
    if (categoryBtn) {
      const category = categoryById(categoryBtn.dataset.categoryId);
      if (category) openCategoryModal(category);
      return;
    }

    const editAccountBtn = event.target.closest('[data-edit-account]');
    if (editAccountBtn) {
      const account = accountById(editAccountBtn.dataset.editAccount);
      if (account) openAccountModal(account);
      return;
    }

    const transferFromBtn = event.target.closest('[data-transfer-from]');
    if (transferFromBtn) { openTransferModal(null, transferFromBtn.dataset.transferFrom); return; }

    const toggleAccountBtn = event.target.closest('[data-toggle-account]');
    if (toggleAccountBtn) { openConfirmAccountState(toggleAccountBtn.dataset.toggleAccount, toggleAccountBtn.dataset.nextState); return; }

    const confirmAccountBtn = event.target.closest('[data-confirm-account-state]');
    if (confirmAccountBtn) { toggleAccountState(confirmAccountBtn.dataset.confirmAccountState, confirmAccountBtn.dataset.nextState, confirmAccountBtn); return; }

    const toggleCategoryBtn = event.target.closest('[data-toggle-category]');
    if (toggleCategoryBtn) { toggleCategoryState(toggleCategoryBtn.dataset.toggleCategory, toggleCategoryBtn.dataset.nextState, toggleCategoryBtn); return; }

    const deleteBtn = event.target.closest('[data-delete-kind][data-delete-id]');
    if (deleteBtn) { openConfirmDelete(deleteBtn.dataset.deleteKind, deleteBtn.dataset.deleteId); return; }

    const confirmDeleteBtn = event.target.closest('[data-confirm-delete-kind][data-confirm-delete-id]');
    if (confirmDeleteBtn) { deleteEntry(confirmDeleteBtn.dataset.confirmDeleteKind, confirmDeleteBtn.dataset.confirmDeleteId, confirmDeleteBtn); return; }

    if (event.target.closest('[data-close-modal]')) { closeModal(); return; }
    if (event.target.matches('[data-modal-backdrop]')) closeModal();
  });

  document.addEventListener('submit', event => {
    if (event.target.id === 'accountForm') { event.preventDefault(); submitAccount(event.target); }

    if (event.target.id === 'categoryForm') { event.preventDefault(); submitCategory(event.target); }

    if (event.target.id === 'settingsForm') { event.preventDefault(); submitSettings(event.target); }
    if (event.target.id === 'receiptMovementForm') { event.preventDefault(); submitReceiptMovement(event.target); }
    if (event.target.id === 'recurringForm') { event.preventDefault(); submitRecurring(event.target); }
    if (event.target.id === 'budgetForm') { event.preventDefault(); submitBudget(event.target); }

  document.addEventListener('change', event => {
    if (event.target.closest('#accountForm, #goalForm, #budgetForm, #movementForm')) updateF81FormPreview();
    if (event.target.id === 'phase6CsvInput') { const file=event.target.files?.[0]; if(file)previewCsvFase6(file); event.target.value=''; return; }
    if (event.target.id === 'recurringType') { const cat=$('#recurringCategory'); if(cat)cat.innerHTML=categoryOptions(event.target.value,''); return; }
    if (event.target.id === 'receiptCameraInput') {
      const files=event.target.files;
      if(files?.length) appendReceiptFiles(files);
      event.target.value=''; return;
    }

    if (event.target.id === 'receiptFilesInput') {
      const files=event.target.files;
      if(files?.length) appendReceiptFiles(files);
      event.target.value=''; return;
    }

    if (event.target.id === 'receiptType') {
      const cat=$('#receiptCategory'); if(cat) cat.innerHTML=receiptCategoryOptions(event.target.value,'');
      return;
    }
    if (event.target.id === 'profilePhotoInput') {
      const file = event.target.files?.[0];
      if (file) prepareProfilePhoto(file);
      event.target.value = '';
      return;
    }

    if (event.target.id === 'settingsCurrency') {
      const symbol = currencySymbol(event.target.value);
      const symbolEl = $('#settingsCurrencySymbol');
      const exampleEl = $('#settingsCurrencyExample');
      if (symbolEl) symbolEl.textContent = symbol;
      if (exampleEl) exampleEl.textContent = `${symbol} · ${event.target.value}`;
    }

    if (event.target.id === 'movementTypeField') {
      const category = $('#movementCategoryField');
      if (category) category.innerHTML = categoryOptions(event.target.value);
    }

    if (event.target.id === 'transferOrigin') {
      const destination = $('#transferDestination');
      if (destination) destination.innerHTML = transferDestinationOptions(event.target.value, '');
      updateTransferExchangePreview();
    }
    if (event.target.id === 'transferDestination') updateTransferExchangePreview();

    if (event.target.id === 'movementType') { state.filters.type = event.target.value; render(); }
    if (event.target.id === 'movementAccount') { state.filters.account = event.target.value; render(); }
    if (event.target.id === 'movementCategory') { state.filters.category = event.target.value; render(); }

    if (event.target.id === 'dashboardChartRange') { state.dashboardChartRange = String(event.target.value || '6M'); render(); }
    if (event.target.id === 'statsRange') { state.statsRange = event.target.value; refreshStats(); }
    if (event.target.id === 'statsCurrency') { state.statsCurrency = event.target.value; refreshStats(); }
  });

  document.addEventListener('input', event => {
    if (event.target.closest('#accountForm, #goalForm, #budgetForm, #movementForm')) updateF81FormPreview();
    if (event.target.id === 'transferAmount' || event.target.id === 'transferRate') updateTransferExchangePreview();
    if (event.target.id === 'settingsUsdDopRate') {
      const n=Number(event.target.value); const el=$('#settingsRatePreview'); if(el&&Number.isFinite(n)&&n>0) el.textContent=n.toFixed(2);
    }
    if (event.target.id === 'movementSearch') {
      state.filters.search = event.target.value;
      const cursor = event.target.selectionStart;
      render();
      const input = $('#movementSearch');
      if (input) { input.focus(); input.setSelectionRange(cursor, cursor); }
    }
  });

  let pinnedChartPoint = null;
  let hoveredDonutPoint = null;

  function donutSegmentFromPointer(svg, event) {
    if (!svg || !event || !Number.isFinite(event.clientX) || !Number.isFinite(event.clientY)) return null;
    const rect = svg.getBoundingClientRect();
    if (!rect.width || !rect.height) return null;
    const cx = rect.left + rect.width / 2, cy = rect.top + rect.height / 2;
    const dx = event.clientX - cx, dy = event.clientY - cy;
    const radius = Math.hypot(dx, dy);
    const ringRadius = Math.min(rect.width, rect.height) * (49 / 140);
    const ringHalf = Math.min(rect.width, rect.height) * (12 / 140);
    if (radius < ringRadius - ringHalf || radius > ringRadius + ringHalf) return null;
    const segments = [...svg.querySelectorAll('.ss82-donut-segment')];
    if (!segments.length) return null;
    const total = segments.reduce((sum,el)=>sum+number(el.dataset.value),0);
    if (!(total > 0)) return null;
    const pct = ((Math.atan2(dy, dx) * 180 / Math.PI + 90 + 360) % 360) / 360 * 100;
    let acc = 0;
    for (const seg of segments) {
      acc += number(seg.dataset.value) / total * 100;
      if (pct <= acc + .0001) return seg;
    }
    return segments[segments.length - 1];
  }

  function showChartTooltip(point, event) {
    const shell = point?.closest?.('.premium-chart-shell');
    const tooltip = shell?.querySelector?.('.premium-chart-tooltip');
    if (!shell || !tooltip) return;
    const currency = point.dataset.currency || currentConfig().monedaPrincipal || 'DOP';
    tooltip.innerHTML = `<span>${safe(point.dataset.label || '')}</span><strong>${safe(formatMoney(number(point.dataset.value), currency))}</strong>`;
    tooltip.classList.add('visible');
    tooltip.setAttribute('aria-hidden','false');

    const shellRect = shell.getBoundingClientRect();
    const pointRect = point.getBoundingClientRect?.();
    const fallbackX = pointRect ? pointRect.left + pointRect.width / 2 : shellRect.left + shellRect.width / 2;
    const fallbackY = pointRect ? pointRect.top + pointRect.height / 2 : shellRect.top + shellRect.height / 2;
    const clientX = Number.isFinite(event?.clientX) && event.clientX ? event.clientX : fallbackX;
    const clientY = Number.isFinite(event?.clientY) && event.clientY ? event.clientY : fallbackY;

    tooltip.style.left = `${Math.max(74, Math.min(shellRect.width - 74, clientX - shellRect.left))}px`;
    tooltip.style.top = `${Math.max(8, Math.min(shellRect.height - 70, clientY - shellRect.top - 74))}px`;
  }

  function hideChartTooltip(point) {
    const tooltip = point?.closest?.('.premium-chart-shell')?.querySelector?.('.premium-chart-tooltip');
    if (!tooltip) return;
    tooltip.classList.remove('visible');
    tooltip.setAttribute('aria-hidden','true');
  }

  function clearPinnedChartPoint(except = null) {
    if (pinnedChartPoint && pinnedChartPoint !== except) {
      pinnedChartPoint.classList?.remove('chart-point-active');
      hideChartTooltip(pinnedChartPoint);
    }
    if (pinnedChartPoint !== except) pinnedChartPoint = null;
  }

  function pinChartPoint(point, event) {
    if (!point) return;
    clearPinnedChartPoint(point);
    pinnedChartPoint = point;
    point.classList.add('chart-point-active');
    showChartTooltip(point, event);
  }

  document.addEventListener('pointermove', event => {
    let point = event.target.closest?.('[data-chart-hover-point]');
    const donutSvg = event.target.closest?.('.ss82-donut-svg');
    if (!point && donutSvg) point = donutSegmentFromPointer(donutSvg, event);
    if (event.pointerType !== 'touch') {
      if (hoveredDonutPoint && hoveredDonutPoint !== point && hoveredDonutPoint !== pinnedChartPoint) hideChartTooltip(hoveredDonutPoint);
      hoveredDonutPoint = donutSvg ? point : null;
      if (point) showChartTooltip(point, event);
    }
  });

  document.addEventListener('pointerout', event => {
    const point = event.target.closest?.('[data-chart-hover-point]');
    const donutSvg = event.target.closest?.('.ss82-donut-svg');
    if (point && event.pointerType !== 'touch' && point !== pinnedChartPoint && !point.contains(event.relatedTarget)) hideChartTooltip(point);
    if (donutSvg && !donutSvg.contains(event.relatedTarget) && hoveredDonutPoint && hoveredDonutPoint !== pinnedChartPoint) {
      hideChartTooltip(hoveredDonutPoint); hoveredDonutPoint = null;
    }
  });

  // En móvil, un toque breve fija el tooltip. No hay que mantener presionado,
  // así evitamos que Chrome seleccione texto de la página que queda debajo.
  document.addEventListener('pointerdown', event => {
    let point = event.target.closest?.('[data-chart-hover-point]');
    const donutSvg = event.target.closest?.('.ss82-donut-svg');
    if (!point && donutSvg) point = donutSegmentFromPointer(donutSvg, event);
    if (point && (event.pointerType === 'touch' || event.pointerType === 'pen')) {
      event.preventDefault();
      pinChartPoint(point, event);
      return;
    }
    if (!point && pinnedChartPoint && !event.target.closest?.('.premium-chart-shell')) {
      clearPinnedChartPoint();
    }
  }, { passive: false });

  // Tap/click funciona también en navegadores que no reportan pointerType de forma fiable.
  document.addEventListener('click', event => {
    let point = event.target.closest?.('[data-chart-hover-point]');
    const donutSvg = event.target.closest?.('.ss82-donut-svg');
    if (!point && donutSvg) point = donutSegmentFromPointer(donutSvg, event);
    if (point) {
      event.preventDefault();
      pinChartPoint(point, event);
    } else if (pinnedChartPoint && !event.target.closest?.('.premium-chart-shell')) {
      clearPinnedChartPoint();
    }
  });

  document.addEventListener('focusin', event => {
    const point = event.target.closest?.('[data-chart-hover-point]');
    if (point) showChartTooltip(point);
  });
  document.addEventListener('focusout', event => {
    const point = event.target.closest?.('[data-chart-hover-point]');
    if (point && point !== pinnedChartPoint) hideChartTooltip(point);
  });

  document.addEventListener('pointerover', event => {
    const legend = event.target.closest?.('[data-donut-legend]');
    if (!legend) return;
    const shell = legend.closest('.ss82-donut-shell');
    const seg = shell?.querySelectorAll?.('.ss82-donut-segment')?.[Number(legend.dataset.donutLegend) || 0];
    if (seg) { seg.classList.add('chart-point-active'); showChartTooltip(seg, event); }
  });
  document.addEventListener('pointerout', event => {
    const legend = event.target.closest?.('[data-donut-legend]');
    if (!legend || legend.contains(event.relatedTarget)) return;
    const shell = legend.closest('.ss82-donut-shell');
    const seg = shell?.querySelectorAll?.('.ss82-donut-segment')?.[Number(legend.dataset.donutLegend) || 0];
    if (seg && seg !== pinnedChartPoint) { seg.classList.remove('chart-point-active'); hideChartTooltip(seg); }
  });

  document.addEventListener('keydown', event => {
    if (event.key === 'Escape' && $('#modalRoot').innerHTML) closeModal();
  });

  // Si el recordatorio se genera desde el trigger o desde Apps Script mientras la app
  // ya está abierta, se sincroniza al volver a la pestaña sin recargar toda Star Stream.
  window.addEventListener('focus', () => {
    syncNotificationsFase611({rerender:state.page==='planificacion'});
  });
  document.addEventListener('visibilitychange', () => {
    document.documentElement.classList.toggle('ss812-tab-hidden', document.hidden);
    if (!document.hidden) {
      setupMobilePerformanceFase812();
      syncNotificationsFase611({rerender:state.page==='planificacion'});
    }
  });

  $('#headerProfileAvatar').addEventListener('click', () => go('configuracion'));
  $('#headerAccount').addEventListener('click', () => openAccountModal());
  $('#fab').addEventListener('click', openNewMovement);
  $('#mobileSettings').addEventListener('click', () => go('configuracion'));
  // La campana se maneja por delegación para que funcione incluso después de rerenders.

  injectStaticIcons();
  setupMobilePerformanceFase812();
  updateNavigation();
  if (restoreBootstrapCacheFase7()) render();
  refresh();
})();
