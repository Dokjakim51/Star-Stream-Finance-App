<script>
(() => {
  'use strict';

  const $ = (selector, root = document) => root.querySelector(selector);
  const $$ = (selector, root = document) => [...root.querySelectorAll(selector)];

  const state = {
    page: 'inicio',
    data: null,
    busy: false,
    mutating: false,
    filters: { type: 'TODOS', account: '', category: '', search: '' },
    dashboardChartRange: '6M',
    statsRange: '6M',
    statsCurrency: '',
    goalFilter: 'ACTIVAS',
    toastTimer: null,
    pendingProfilePhoto: '',
    pendingReceiptFiles: [],
    receiptTargetMovementId: '',
    pendingImportCsv: '',
    fullLoaded: false,
    fullLoading: null,
    sectionsLoaded: {dashboard:false,movimientos:false,planificacion:false,cuentas:false,metas:false,configuracion:false}
  };

  let notificationSyncInFlightFase611 = false;

  const pageMeta = {
    inicio: ['STAR STREAM · v0.8.18', 'Inicio', 'Tu dinero, claro y bajo control.'],
    movimientos: ['MOVIMIENTOS', 'Movimientos', 'Ingresos, gastos y transferencias en un solo historial.'],

    configuracion: ['CONFIGURACIÓN', 'Configuración', 'Categorías e información de tu instalación.']
  };

  const iconPaths = {
    home: '<path d="M3 11.5 12 4l9 7.5"/><path d="M5.5 10.5V20h13v-9.5"/>',
    swap: '<path d="M7 7h11l-3-3"/><path d="m18 7-3 3"/><path d="M17 17H6l3 3"/><path d="m6 17 3-3"/>',
    transfer: '<path d="M7 7h10l-3-3"/><path d="m17 7-3 3"/><path d="M17 17H7l3 3"/><path d="m7 17 3-3"/>',
    target: '<circle cx="12" cy="12" r="8"/><circle cx="12" cy="12" r="3"/><path d="M12 2v3M22 12h-3M12 22v-3M2 12h3"/>',
    chart: '<path d="M4 19V9"/><path d="M10 19V5"/><path d="M16 19v-7"/><path d="M22 19H2"/>',
    wallet: '<path d="M4 6.5A2.5 2.5 0 0 1 6.5 4H18v16H6.5A2.5 2.5 0 0 1 4 17.5z"/><path d="M4 8h15a2 2 0 0 1 2 2v5h-5a2.5 2.5 0 0 1 0-5h5"/>',
    calendar: '<rect x="3" y="5" width="18" height="16" rx="2"/><path d="M16 3v4M8 3v4M3 10h18"/>',
    bell: '<path d="M18 8a6 6 0 0 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9"/><path d="M10 21h4"/>',
    repeat: '<path d="M17 1l4 4-4 4"/><path d="M3 11V9a4 4 0 0 1 4-4h14"/><path d="m7 23-4-4 4-4"/><path d="M21 13v2a4 4 0 0 1-4 4H3"/>',
    download: '<path d="M12 3v12"/><path d="m7 10 5 5 5-5"/><path d="M5 21h14"/>',
    upload: '<path d="M12 21V9"/><path d="m7 14 5-5 5 5"/><path d="M5 3h14"/>',
    backup: '<path d="M4 7h16v13H4z"/><path d="M7 7V4h10v3"/><path d="M8 12h8M8 16h5"/>',
    pause: '<path d="M8 5v14M16 5v14"/>',
    play: '<path d="m8 5 11 7-11 7z"/>',
    skip: '<path d="m5 6 9 6-9 6z"/><path d="M18 6v12"/>',
    settings: '<circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .34 1.88l.06.06-2.83 2.83-.06-.06A1.7 1.7 0 0 0 15 19.4a1.7 1.7 0 0 0-1 .6 1.7 1.7 0 0 0-.4 1.1V21h-4v-.1a1.7 1.7 0 0 0-1.4-1.7 1.7 1.7 0 0 0-1.8.5l-.06.06-2.83-2.83.06-.06A1.7 1.7 0 0 0 4 15a1.7 1.7 0 0 0-.6-1 1.7 1.7 0 0 0-1.1-.4H2v-4h.3A1.7 1.7 0 0 0 4 8.2a1.7 1.7 0 0 0-.5-1.8l-.06-.06 2.83-2.83.06.06A1.7 1.7 0 0 0 8.2 4a1.7 1.7 0 0 0 1-.6 1.7 1.7 0 0 0 .4-1.1V2h4v.3A1.7 1.7 0 0 0 15 4a1.7 1.7 0 0 0 1.8-.5l.06-.06 2.83 2.83-.06.06A1.7 1.7 0 0 0 19.4 8c.1.4.3.7.6 1 .3.2.7.4 1.1.4H22v4h-.9a1.7 1.7 0 0 0-1.7 1.6Z"/>',
    plus: '<path d="M12 5v14M5 12h14"/>',
    search: '<circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/>',
    close: '<path d="M6 6l12 12M18 6 6 18"/>',
    trash: '<path d="M4 7h16"/><path d="m9 7 1-2h4l1 2"/><path d="m6 7 1 13h10l1-13"/><path d="M10 11v5M14 11v5"/>',
    edit: '<path d="M4 20h4l11-11-4-4L4 16z"/><path d="m13.5 6.5 4 4"/>',
    archive: '<rect x="3" y="4" width="18" height="5" rx="1"/><path d="M5 9v10h14V9"/><path d="M9 13h6"/>',
    restore: '<path d="M4 12a8 8 0 1 0 2.3-5.7L4 8.6"/><path d="M4 4v4.6h4.6"/>',
    tag: '<path d="M20 13 11 22l-9-9V4h9z"/><circle cx="7" cy="9" r="1"/>',
    refresh: '<path d="M20 6v5h-5"/><path d="M4 18v-5h5"/><path d="M18.5 9A7 7 0 0 0 6 6.5L4 11"/><path d="M5.5 15A7 7 0 0 0 18 17.5l2-4.5"/>',
    bank: '<path d="M3 10h18"/><path d="M5 10v8M9.5 10v8M14.5 10v8M19 10v8"/><path d="M2 20h20M12 3 3 8h18z"/>',
    cash: '<rect x="3" y="6" width="18" height="12" rx="2"/><circle cx="12" cy="12" r="2.5"/><path d="M7 9h.01M17 15h.01"/>',
    savings: '<path d="M4 12c0-4 3.5-7 8-7 4.8 0 8 2.7 8 6.5 0 4-3.6 7.5-9 7.5H7l-2 2v-4.5A7 7 0 0 1 4 12Z"/><path d="M15 8.5h.01"/>',
    other: '<rect x="4" y="4" width="16" height="16" rx="4"/><path d="M8 12h.01M12 12h.01M16 12h.01"/>',
    alert: '<path d="M10.3 4.2 2.8 17.5A2 2 0 0 0 4.5 20h15a2 2 0 0 0 1.7-2.5L13.7 4.2a2 2 0 0 0-3.4 0Z"/><path d="M12 9v4M12 17h.01"/>',
    check: '<path d="m5 12 4 4L19 6"/>',
    info: '<circle cx="12" cy="12" r="9"/><path d="M12 11v5M12 8h.01"/>',
    receipt: '<path d="M6 3h12v18l-2-1.5L14 21l-2-1.5L10 21l-2-1.5L6 21z"/><path d="M9 8h6M9 12h6M9 16h4"/>',
    camera: '<path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3"/>',
    eye: '<path d="M2 12s3.5-6 10-6 10 6 10 6-3.5 6-10 6S2 12 2 12Z"/><circle cx="12" cy="12" r="2.5"/>',
    eyeOff: '<path d="M3 3l18 18"/><path d="M10.6 10.7a2 2 0 0 0 2.7 2.7"/><path d="M9.9 5.1A11.3 11.3 0 0 1 12 5c6.5 0 10 7 10 7a17.3 17.3 0 0 1-3.2 4.2"/><path d="M6.6 6.6C3.8 8.4 2 12 2 12s3.5 7 10 7c1.8 0 3.4-.4 4.8-1.1"/>',
    shield: '<path d="M12 3l7 3v5c0 4.6-2.8 8.4-7 10-4.2-1.6-7-5.4-7-10V6z"/><path d="M9.5 12.5 11 14l3.5-4"/>'
  };

  function icon(name, size = 20) {
    const paths = iconPaths[name] || iconPaths.info;
    return `<svg width="${size}" height="${size}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${paths}</svg>`;
  }

  function injectStaticIcons() {
    $$('[data-icon]').forEach(el => { el.innerHTML = icon(el.dataset.icon, 20); });
    $('#fab').innerHTML = icon('plus', 24);
    $('#mobileSettings').innerHTML = icon('settings', 20);
    if ($('#notificationIcon')) $('#notificationIcon').innerHTML = icon('bell', 20);
  }

  const call = (name, ...args) => new Promise((resolve, reject) => {
    if (!window.google?.script?.run) {
      reject(new Error('Abre Star Stream desde la URL publicada de Apps Script.'));
      return;
    }
    google.script.run
      .withSuccessHandler(resolve)
      .withFailureHandler(reject)[name](...args);
  });

  function errorMessage(err) {
    const raw = err?.message || (typeof err === 'string' ? err : 'No se pudo completar la operación.');
    return String(raw).replace(/^Error:\s*/i, '').trim();
  }

  function fail(err, context = 'Operación') {
    console.error(`STAR STREAM · ${context}:`, err);
    if (err?.stack) console.error(err.stack);
    return errorMessage(err);
  }

  function safe(value) {
    return String(value ?? '').replace(/[&<>'"]/g, ch => ({
      '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;'
    }[ch]));
  }

  function number(value) {
    const n = Number(value);
    return Number.isFinite(n) ? n : 0;
  }

  function configObject(value) {
    if (!value) return {};
    if (!Array.isArray(value)) return value;
    return Object.fromEntries(value
      .filter(row => row && (row.clave !== undefined || row.key !== undefined))
      .map(row => [String(row.clave ?? row.key), row.valor ?? row.value ?? '']));
  }

  function currentConfig() { return configObject(state.data?.configuracion); }

  function validProfilePhoto(value) {
    return /^data:image\/jpeg;base64,[A-Za-z0-9+/=]+$/.test(String(value || ''));
  }

  function profileInitials(name = '') {
    const parts = String(name || '').trim().split(/\s+/).filter(Boolean).slice(0, 2);
    if (!parts.length) return '✦';
    return parts.map(part => part[0]?.toUpperCase() || '').join('') || '✦';
  }

  function renderAvatarElement(element, photo, name) {
    if (!element) return;
    element.replaceChildren();
    if (validProfilePhoto(photo)) {
      const img = document.createElement('img');
      img.src = photo;
      img.alt = '';
      img.decoding = 'async';
      element.appendChild(img);
    } else {
      const span = document.createElement('span');
      span.textContent = profileInitials(name);
      element.appendChild(span);
    }
  }

  function profilePhotoMarkup(photo, name) {
    return validProfilePhoto(photo)
      ? `<img src="${safe(photo)}" alt="Foto de perfil">`
      : `<span>${safe(profileInitials(name))}</span>`;
  }

  function currencySymbol(currency = 'DOP') {
    const code = String(currency || 'DOP').toUpperCase();
    if (code === 'DOP') return 'RD$';
    if (code === 'USD') return 'US$';
    return code;
  }

  function configuredUsdDopRate() {
    const n = Number(currentConfig().tasaUsdDop || 59.4901);
    return Number.isFinite(n) && n > 0 ? n : 59.4901;
  }

  function convertCurrencyAmount(amount, fromCurrency, toCurrency, rate = configuredUsdDopRate()) {
    const value = Number(amount);
    const from = String(fromCurrency || '').toUpperCase();
    const to = String(toCurrency || '').toUpperCase();
    const fx = Number(rate);
    if (!Number.isFinite(value)) return null;
    if (from === to) return value;
    if (!Number.isFinite(fx) || fx <= 0) return null;
    if (from === 'USD' && to === 'DOP') return value * fx;
    if (from === 'DOP' && to === 'USD') return value / fx;
    return null;
  }

  function formatMoney(value, currency = 'DOP') {
    const n = Number(value);
    if (!Number.isFinite(n)) return '—';
    const code = String(currency || 'DOP').toUpperCase();
    const amount = n.toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
    if (code === 'DOP' || code === 'USD') return `${currencySymbol(code)} ${amount}`;
    try {
      return new Intl.NumberFormat('es-DO', { style: 'currency', currency: code, minimumFractionDigits: 2 }).format(n);
    } catch (_) {
      return `${code} ${amount}`;
    }
  }

  function formatMoneyUI(value, currency = 'DOP') {
    const n = Number(value);
    if (!Number.isFinite(n)) return '—';
    const code = String(currency || 'DOP').toUpperCase();
    const hasCents = Math.abs(n - Math.round(n)) > .0001;
    const amount = n.toLocaleString('en-US', { minimumFractionDigits: hasCents ? 2 : 0, maximumFractionDigits: 2 });
    if (code === 'DOP' || code === 'USD') return `${currencySymbol(code)} ${amount}`;
    try { return new Intl.NumberFormat('es-DO', { style:'currency', currency:code, minimumFractionDigits:hasCents?2:0, maximumFractionDigits:2 }).format(n); }
    catch (_) { return `${code} ${amount}`; }
  }

  function dateKey(value) {
    if (value === null || value === undefined || value === '') return '';
    const match = String(value).trim().match(/^(\d{4})-(\d{2})-(\d{2})/);
    return match ? `${match[1]}-${match[2]}-${match[3]}` : '';
  }

  function friendly(value) {
    const key = dateKey(value);
    if (!key) return value ? String(value) : '—';
    const [year, month, day] = key.split('-').map(Number);
    const months = ['ene.', 'feb.', 'mar.', 'abr.', 'may.', 'jun.', 'jul.', 'ago.', 'sept.', 'oct.', 'nov.', 'dic.'];
    if (month < 1 || month > 12 || day < 1 || day > 31) return String(value);
    return `${day} ${months[month - 1]} ${year}`;
  }

  function todayISO() {
    const parts = new Intl.DateTimeFormat('en-CA', {
      timeZone: 'America/Santo_Domingo', year: 'numeric', month: '2-digit', day: '2-digit'
    }).formatToParts(new Date());
    const map = Object.fromEntries(parts.map(p => [p.type, p.value]));
    return `${map.year}-${map.month}-${map.day}`;
  }

  function formatPeriod(period) {
    const match = String(period || '').match(/^(\d{4})-(\d{2})$/);
    if (!match) return period || 'Mes actual';
    const months = ['Enero','Febrero','Marzo','Abril','Mayo','Junio','Julio','Agosto','Septiembre','Octubre','Noviembre','Diciembre'];
    return `${months[Number(match[2]) - 1]} ${match[1]}`;
  }

  function normalizeData(data) {
    const result = data || {};
    result.categorias = Array.isArray(result.categorias) ? result.categorias : [];
    result.categoriasTodas = Array.isArray(result.categoriasTodas) ? result.categoriasTodas : result.categorias;
    result.movimientos = Array.isArray(result.movimientos) ? result.movimientos : [];
    result.transferencias = Array.isArray(result.transferencias) ? result.transferencias : [];
    result.movimientosMetas = Array.isArray(result.movimientosMetas) ? result.movimientosMetas : [];
    result.metas = Array.isArray(result.metas) ? result.metas : [];
    result.comprobantes = Array.isArray(result.comprobantes) ? result.comprobantes : [];
    result.recurrentes = Array.isArray(result.recurrentes) ? result.recurrentes : [];
    result.presupuestos = Array.isArray(result.presupuestos) ? result.presupuestos : [];
    result.notificaciones = Array.isArray(result.notificaciones) ? result.notificaciones : [];
    result.resumenPlanificacion = result.resumenPlanificacion || null;
    result.triggerFase6 = result.triggerFase6 || null;
    result.estadisticas = result.estadisticas || null;
    result.resumen = result.resumen || {};
    result.resumen.cuentas = Array.isArray(result.resumen.cuentas) ? result.resumen.cuentas : [];
    result.cuentasTodas = Array.isArray(result.cuentasTodas) ? result.cuentasTodas : result.resumen.cuentas;
    result.resumen.movimientosRecientes = Array.isArray(result.resumen.movimientosRecientes)
      ? result.resumen.movimientosRecientes : result.movimientos.slice(0, 6);
    const cfg = configObject(result.configuracion);
    if (!state.statsCurrency) state.statsCurrency = String(cfg.monedaPrincipal || 'DOP').toUpperCase();
    return result;
  }

  const BOOTSTRAP_CACHE_FASE7 = 'starstream:f7:bootstrap';
  function saveBootstrapCacheFase7() {
    if (!state.data) return;
    try {
      const r=state.data.resumen||{};
      const lightResumen={...r};
      ['movimientos','transferencias','movimientosMetas','metas'].forEach(k=>delete lightResumen[k]);
      const payload={ts:Date.now(),data:{
        configuracion:state.data.configuracion,
        categorias:state.data.categorias,
        categoriasTodas:state.data.categorias,
        resumen:lightResumen,
        movimientos:(state.data.movimientos||[]).slice(0,8),
        transferencias:(state.data.transferencias||[]).slice(0,6),
        movimientosMetas:(state.data.movimientosMetas||[]).slice(0,6),
        cuentasTodas:state.data.resumen?.cuentas||[],metas:[],comprobantes:[],recurrentes:[],presupuestos:[],notificaciones:[],estadisticas:null,resumenPlanificacion:null
      }};
      sessionStorage.setItem(BOOTSTRAP_CACHE_FASE7,JSON.stringify(payload));
    } catch (_) {}
  }
  function restoreBootstrapCacheFase7() {
    try {
      const parsed=JSON.parse(sessionStorage.getItem(BOOTSTRAP_CACHE_FASE7)||'null');
      if(!parsed?.data || Date.now()-Number(parsed.ts||0)>15*60*1000) return false;
      state.data=normalizeData(parsed.data);
      return true;
    } catch (_) { return false; }
  }

  function allAccounts() { return state.data?.cuentasTodas || state.data?.resumen?.cuentas || []; }
  function activeAccounts() { return allAccounts().filter(a => a.activa !== false); }
  function allCategories() { return state.data?.categoriasTodas || state.data?.categorias || []; }
  function activeCategories() { return allCategories().filter(c => c.activa !== false); }

  function accountById(id) { return allAccounts().find(c => String(c.id) === String(id)); }
  function categoryById(id) { return allCategories().find(c => String(c.id) === String(id)); }

  function allGoals() { return state.data?.metas || []; }
  function goalById(id) { return allGoals().find(g => String(g.id) === String(id)); }
  function goalMovementById(id) { return (state.data?.movimientosMetas || []).find(x => String(x.id) === String(id)); }
  function allReceipts() { return state.data?.comprobantes || []; }
  function receiptById(id) { return allReceipts().find(r => String(r.id) === String(id)); }
  function receiptByMovementId(id) { return allReceipts().find(r => String(r.movimientoId) === String(id)); }
  function allRecurrentes() { return state.data?.recurrentes || []; }
  function recurrenteById(id) { return allRecurrentes().find(x => String(x.id) === String(id)); }
  function allPresupuestos() { return state.data?.presupuestos || []; }
  function presupuestoById(id) { return allPresupuestos().find(x => String(x.id) === String(id)); }
  function allNotifications() { return state.data?.notificaciones || []; }
  function goalStatusLabel(status) {
    const map = {ACTIVA:'Activa',PAUSADA:'Pausada',COMPLETADA:'Completada',ARCHIVADA:'Archivada'};
    return map[String(status || '').toUpperCase()] || 'Activa';
  }
  function monthLabel(key) {
    const m = String(key || '').match(/^(\d{4})-(\d{2})$/);
    if (!m) return key || '';
    const months = ['Ene','Feb','Mar','Abr','May','Jun','Jul','Ago','Sep','Oct','Nov','Dic'];
    return `${months[Number(m[2])-1]} ${String(m[1]).slice(2)}`;
  }

  function accountBalance(account) {
    if (!account) return 0;
    for (const key of ['saldoActual', 'saldo', 'balance', 'saldoCalculado']) {
      if (Number.isFinite(Number(account[key]))) return Number(account[key]);
    }
    const fallback = Object.entries(account).find(([key, value]) =>
      /saldo|balance/i.test(key) && Number.isFinite(Number(value))
    );
    return fallback ? Number(fallback[1]) : 0;
  }

  function accountCurrency(account) {
    return String(account?.moneda || currentConfig().monedaPrincipal || 'DOP').toUpperCase();
  }

  function movementTitle(m) {
    const cat = categoryById(m.categoriaId);
    return m.descripcion || cat?.nombre || (m.tipo === 'INGRESO' ? 'Ingreso' : 'Gasto');
  }

  function movementIcon(m) {
    const cat = categoryById(m.categoriaId);
    if (cat?.icono) return safe(cat.icono);
    return m.tipo === 'INGRESO' ? '↙' : '↗';
  }

  function activityEntries() {
    const movements = (state.data?.movimientos || []).map(m => ({
      kind: 'MOVIMIENTO', id: m.id, fecha: m.fecha,
      sortStamp: m.fechaActualizacion || m.fechaCreacion || '', data: m
    }));
    const transfers = (state.data?.transferencias || []).map(t => ({
      kind: 'TRANSFERENCIA', id: t.id, fecha: t.fecha,
      sortStamp: t.fechaActualizacion || t.fechaCreacion || '', data: t
    }));
    const goals = (state.data?.movimientosMetas || []).map(x => ({
      kind: 'META', id: x.id, fecha: x.fecha,
      sortStamp: x.fechaActualizacion || x.fechaCreacion || '', data: x
    }));
    return [...movements, ...transfers, ...goals].sort((a,b) => {
      const fa = dateKey(a.fecha), fb = dateKey(b.fecha);
      if (fa !== fb) return fb.localeCompare(fa);
      return String(b.sortStamp).localeCompare(String(a.sortStamp));
    });
  }

  function activityRecentStamp(entry) {
    // Para movimientos creados desde un comprobante, la fecha de la factura
    // puede ser antigua. Para "Actividad reciente" y la pantalla Movimientos
    // usamos cuándo se registró/escaneó en Star Stream, no la fecha contable.
    if (entry?.kind === 'MOVIMIENTO') {
      const receipt = receiptByMovementId(entry.id);
      const receiptStamp = String(receipt?.fechaActualizacion || receipt?.fechaCreacion || '');
      if (receiptStamp) return receiptStamp;
    }
    return String(entry?.sortStamp || '');
  }

  function recentActivityEntries() {
    return activityEntries().slice().sort((a,b) => {
      const sa = activityRecentStamp(a);
      const sb = activityRecentStamp(b);
      if (sa !== sb) return sb.localeCompare(sa);
      const fa = dateKey(a.fecha), fb = dateKey(b.fecha);
      return fb.localeCompare(fa);
    });
  }

  function transferDirectionForAccount(t, accountId) {
    if (!accountId) return 'neutral';
    if (String(t.cuentaOrigenId) === String(accountId)) return 'out';
    if (String(t.cuentaDestinoId) === String(accountId)) return 'in';
    return 'neutral';
  }

  function activityRow(entry) {
    if (entry.kind === 'TRANSFERENCIA') {
      const t = entry.data;
      const from = accountById(t.cuentaOrigenId);
      const to = accountById(t.cuentaDestinoId);
      const fromCurrency = accountCurrency(from);
      const toCurrency = accountCurrency(to);
      const destinationAmount = Number(t.montoDestino) > 0 ? Number(t.montoDestino) : number(t.monto);
      const direction = transferDirectionForAccount(t, state.filters.account);

  function monthKeyOffset(offset = 0) {
    const current = todayISO().slice(0, 7).split('-').map(Number);
    const d = new Date(Date.UTC(current[0], current[1] - 1 + offset, 1));
    return `${d.getUTCFullYear()}-${String(d.getUTCMonth() + 1).padStart(2, '0')}`;
  }

  function monthShortLabel(key) {
    const match = String(key || '').match(/^(\d{4})-(\d{2})$/);
    if (!match) return key || '';
    const names = ['Ene','Feb','Mar','Abr','May','Jun','Jul','Ago','Sep','Oct','Nov','Dic'];
    return names[Number(match[2]) - 1] || key;
  }

  function compactChartValue(value) {
    const n = Math.abs(number(value));
    const sign = number(value) < 0 ? '−' : '';
    if (n >= 1000000) return `${sign}${(n / 1000000).toFixed(n >= 10000000 ? 0 : 1).replace('.0','')}M`;
    if (n >= 1000) return `${sign}${(n / 1000).toFixed(n >= 100000 ? 0 : 1).replace('.0','')}k`;
    return `${sign}${Math.round(n)}`;
  }

  function smoothSvgPath(points, tension = 0.18) {
    if (!points.length) return '';
    if (points.length === 1) return `M ${points[0].x.toFixed(2)} ${points[0].y.toFixed(2)}`;
    let d = `M ${points[0].x.toFixed(2)} ${points[0].y.toFixed(2)}`;
    for (let i = 0; i < points.length - 1; i++) {
      const p0 = points[i - 1] || points[i];
      const p1 = points[i];
      const p2 = points[i + 1];
      const p3 = points[i + 2] || p2;
      const cp1x = p1.x + (p2.x - p0.x) * tension;
      const cp1y = p1.y + (p2.y - p0.y) * tension;
      const cp2x = p2.x - (p3.x - p1.x) * tension;
      const cp2y = p2.y - (p3.y - p1.y) * tension;
      d += ` C ${cp1x.toFixed(2)} ${cp1y.toFixed(2)}, ${cp2x.toFixed(2)} ${cp2y.toFixed(2)}, ${p2.x.toFixed(2)} ${p2.y.toFixed(2)}`;
    }
    return d;
  }


  function addDaysToKey(key, offset = 0) {
    const match = String(key || '').match(/^(\d{4})-(\d{2})-(\d{2})$/);
    if (!match) return '';
    const d = new Date(Date.UTC(Number(match[1]), Number(match[2]) - 1, Number(match[3]) + Number(offset || 0)));
    return `${d.getUTCFullYear()}-${String(d.getUTCMonth()+1).padStart(2,'0')}-${String(d.getUTCDate()).padStart(2,'0')}`;
  }

  function monthEndKeyOffset(offset = 0) {
    const [year, month] = todayISO().slice(0,7).split('-').map(Number);
    const end = new Date(Date.UTC(year, month + Number(offset || 0), 0));
    const key = `${end.getUTCFullYear()}-${String(end.getUTCMonth()+1).padStart(2,'0')}-${String(end.getUTCDate()).padStart(2,'0')}`;
    return key > todayISO() ? todayISO() : key;
  }

  function shortDayLabel(key) {
    const match = String(key || '').match(/^(\d{4})-(\d{2})-(\d{2})$/);
    if (!match) return key || '';
    const names = ['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];
    return `${Number(match[3])} ${names[Number(match[2])-1]}`;
  }

  function dashboardRangePoints(range = '6M') {
    const today = todayISO();
    const code = String(range || '6M').toUpperCase();

    const daily = count => Array.from({length:count}, (_,i) => {
      const key = addDaysToKey(today, i - count + 1);
      return {key,label:shortDayLabel(key),hoverLabel:friendly(key)};
    });

    if (code === '7D') return daily(7);
    if (code === '15D') return daily(15);
    if (code === '1M') return daily(30);

    if (code === '6W') {
      return Array.from({length:7}, (_,i) => {
        const key = addDaysToKey(today, (i - 6) * 7);
        return {key,label:shortDayLabel(key),hoverLabel:friendly(key)};
      });
    }

    const count = code === '3M' ? 3 : code === '12M' ? 12 : 6;
    return Array.from({length:count}, (_,i) => {
      const offset = i - count + 1;
      const key = offset === 0 ? today : monthEndKeyOffset(offset);
      const month = key.slice(0,7);
      return {key,label:monthShortLabel(month),hoverLabel:formatPeriod(month)};
    });
  }

  function buildFinancialBalanceSeries(range = '6M', currency = 'DOP') {
    const code = String(currency || 'DOP').toUpperCase();
    const rate = configuredUsdDopRate();
    const points = dashboardRangePoints(range);
    const convertible = cur => cur === code || ((cur === 'USD' || cur === 'DOP') && (code === 'USD' || code === 'DOP'));
    const accounts = allAccounts().filter(a => convertible(accountCurrency(a)));
    if (!accounts.length || !points.length) return [];

    const accountMap = Object.fromEntries(accounts.map(a => [String(a.id),a]));
    const accountIds = new Set(Object.keys(accountMap));
    const movements = (state.data?.movimientos || []).filter(m => accountIds.has(String(m.cuentaId)));
    const transfers = (state.data?.transferencias || []).filter(t => accountIds.has(String(t.cuentaOrigenId)) || accountIds.has(String(t.cuentaDestinoId)));

    const converted = (amount, account) => convertCurrencyAmount(number(amount),accountCurrency(account),code,rate);

    return points.map(point => {
      let balance = 0;
      accounts.forEach(account => {
        const created = dateKey(account?.fechaCreacion);
        if (!created || created <= point.key) balance += number(converted(account.saldoInicial,account));
      });
      movements.forEach(m => {
        const key = dateKey(m.fecha);
        const account = accountMap[String(m.cuentaId)];
        if (account && key && key <= point.key) {
          const value = converted(m.monto,account);
          if (Number.isFinite(value)) balance += (String(m.tipo).toUpperCase() === 'INGRESO' ? 1 : -1) * value;
        }
      });
      transfers.forEach(t => {
        const key = dateKey(t.fecha);
        if (!key || key > point.key) return;
        const from = accountMap[String(t.cuentaOrigenId)];
        const to = accountMap[String(t.cuentaDestinoId)];
        if (from) {
          const out = converted(t.monto,from);
          if (Number.isFinite(out)) balance -= out;
        }
        if (to) {
          const destinationAmount = Number(t.montoDestino)>0?Number(t.montoDestino):number(t.monto);
          const incoming = converted(destinationAmount,to);
          if (Number.isFinite(incoming)) balance += incoming;
        }
      });
      return {...point,balance};
    });
  }

  function chartScale(values, tickCount = 4) {
    let min = Math.min(0, ...values.map(number));
    let max = Math.max(0, ...values.map(number));
    if (min === max) max = min + 1;
    const rawRange = max - min;
    const magnitude = Math.pow(10, Math.floor(Math.log10(Math.max(1, rawRange / tickCount))));
    const normalized = rawRange / tickCount / magnitude;
    const stepBase = normalized <= 1 ? 1 : normalized <= 2 ? 2 : normalized <= 5 ? 5 : 10;
    const step = stepBase * magnitude;
    min = Math.floor(min / step) * step;
    max = Math.ceil(max / step) * step;
    if (min === max) max += step;
    const ticks = [];
    for (let v = min; v <= max + step * .1; v += step) ticks.push(v);
    return { min, max, ticks };
  }

        </defs>
        ${scale.ticks.map(v => { const yy = y(v); return `<line x1="${pad.left}" y1="${yy.toFixed(2)}" x2="${width-pad.right}" y2="${yy.toFixed(2)}" class="premium-grid-line"></line><text x="${pad.left-14}" y="${(yy+4).toFixed(2)}" text-anchor="end" class="premium-y-label">${safe(compactChartValue(v))}</text>`; }).join('')}
        ${areaPath ? `<path d="${areaPath}" fill="url(#wealthGradient${uid})" class="premium-area-fill"></path>` : ''}
        <path d="${linePath}" class="premium-balance-line" filter="url(#wealthGlow${uid})"></path>
        ${points.map((p,i) => chartHoverPoint(p.x,p.y,p.hoverLabel,p.balance,currency,'balance',visiblePoint(i))).join('')}
        ${points.map((p,i) => visiblePoint(i) ? `<text x="${p.x.toFixed(2)}" y="${height-12}" text-anchor="middle" class="premium-x-label">${safe(p.label)}</text>` : '').join('')}
      </svg>

  function monthlyEvolutionChart(stats) {
    const data = stats?.serieMensual || [];
    if (!data.length) return `<div class="empty-state"><div class="empty-icon">${icon('chart',27)}</div><h3>No hay datos en este período</h3><p>Registra ingresos o gastos para ver la evolución mensual.</p></div>`;
    const currency = stats?.moneda || currentConfig().monedaPrincipal || 'DOP';
    if (data.length === 1) {
      const only = data[0], max = Math.max(1, number(only.ingresos), number(only.gastos));
      return `<div class="single-period-chart"><div class="single-period-heading"><strong>${safe(formatPeriod(only.mes))}</strong><span>Un único mes no forma una curva histórica todavía.</span></div><div class="single-period-row income"><div><span>Ingresos</span><strong>${safe(formatMoney(only.ingresos,currency))}</strong></div><div class="single-period-track"><i style="width:${Math.max(2,number(only.ingresos)/max*100).toFixed(1)}%"></i></div></div><div class="single-period-row expense"><div><span>Gastos</span><strong>${safe(formatMoney(only.gastos,currency))}</strong></div><div class="single-period-track"><i style="width:${Math.max(2,number(only.gastos)/max*100).toFixed(1)}%"></i></div></div></div>`;
    }
    const width = 780, height = 300;
    const pad = { left: 70, right: 24, top: 26, bottom: 42 };
    const plotW = width-pad.left-pad.right, plotH = height-pad.top-pad.bottom;
    const scale = chartScale(data.flatMap(x => [number(x.ingresos), number(x.gastos)]),4);
    const x = i => pad.left + i * plotW/(data.length-1), y = v => pad.top + (scale.max-number(v))/(scale.max-scale.min)*plotH;
    const income = data.map((d,i)=>({x:x(i),y:y(d.ingresos),mes:d.mes,value:number(d.ingresos)}));
    const expense = data.map((d,i)=>({x:x(i),y:y(d.gastos),mes:d.mes,value:number(d.gastos)}));
    const incomePath = smoothSvgPath(income), expensePath = smoothSvgPath(expense), bottom = y(0), uid=Math.random().toString(36).slice(2,8);
    const incomeArea = `${incomePath} L ${income.at(-1).x.toFixed(2)} ${bottom.toFixed(2)} L ${income[0].x.toFixed(2)} ${bottom.toFixed(2)} Z`;
    const expenseArea = `${expensePath} L ${expense.at(-1).x.toFixed(2)} ${bottom.toFixed(2)} L ${expense[0].x.toFixed(2)} ${bottom.toFixed(2)} Z`;

  function pageIntroFase8(title, subtitle, actionHtml = '') {
    return `<div class="f8-page-intro"><div><h2>${safe(title)}</h2><p>${safe(subtitle)}</p></div>${actionHtml}</div>`;

  function progressBarFase8(value, tone = 'primary', label = '') {
    const actual = Math.max(0, Number(value) || 0);
    const width = Math.min(100, actual);
    return `<div class="f8-progress-wrap ${safe(tone)}"><div class="f8-progress-track"><i style="width:${width.toFixed(1)}%"></i></div><strong>${label ? safe(label) : `${actual.toFixed(0)}%`}</strong></div>`;
  }

  function savingsThisPeriodFase8(summary) {
    const income = Number(summary?.ingresosPeriodo);
    const expense = Number(summary?.gastosPeriodo);
    return Number.isFinite(income) && Number.isFinite(expense) ? income - expense : null;
  }

  function statPercentChangeFase8(current, difference) {
    const now = Number(current), diff = Number(difference);
    if (!Number.isFinite(now) || !Number.isFinite(diff)) return null;
    const previous = now - diff;
    if (Math.abs(previous) < .005) return Math.abs(diff) < .005 ? 0 : null;
    return diff / Math.abs(previous) * 100;
  }

  function changePillFase8(current, difference, goodWhenPositive = true) {
    const pct = statPercentChangeFase8(current, difference);
    if (pct === null) return '';
    const positive = pct >= 0;
    const good = goodWhenPositive ? positive : !positive;
    const arrow = positive ? '↑' : '↓';
    return `<span class="f8-change ${good?'good':'bad'}">${arrow} ${Math.abs(pct).toFixed(0)}% <em>vs. período anterior</em></span>`;
  }

  function donutChartFase82(rows, currency, centerValue, centerLabel, className = '') {
    const clean = (rows || []).filter(x => Number(x.value) > 0);
    const total = clean.reduce((sum,x)=>sum+number(x.value),0);
    if (!clean.length || total <= 0) {
      return `<div class="f8-donut-empty"><span>${icon('chart',28)}</span><strong>Sin datos para distribuir</strong><small>Cuando existan valores reales, aquí aparecerá la distribución.</small></div>`;
    }
    const colors=['#7b5cff','#ff426f','#ffc64f','#35c8e8','#20d7a0','#4d8dff','#a85dff','#ff914d'];
    let offset=0;
    const segments=clean.map((r,i)=>{
      const pct=number(r.value)/total*100;
      const html=`<circle class="ss82-donut-segment premium-chart-point" cx="70" cy="70" r="49" pathLength="100"
        fill="none" stroke="${colors[i%colors.length]}" stroke-width="18"
        stroke-dasharray="${pct.toFixed(4)} ${(100-pct).toFixed(4)}"
        stroke-dashoffset="${(-offset).toFixed(4)}"
        data-chart-hover-point data-label="${safe(r.label)}" data-value="${safe(r.value)}" data-currency="${safe(currency)}"
        tabindex="0" role="img" aria-label="${safe(r.label)}: ${safe(formatMoney(r.value,currency))}"></circle>`;
      offset+=pct;
      return html;
    }).join('');
    return `<div class="premium-chart-shell ss82-donut-shell ${safe(className)}">
      <div class="premium-chart-tooltip" aria-hidden="true"></div>
      <div class="ss82-donut-layout">
        <div class="ss82-donut-graphic">
          <svg class="ss82-donut-svg" viewBox="0 0 140 140" role="img" aria-label="${safe(centerLabel)}">
            <circle class="ss82-donut-track" cx="70" cy="70" r="49" fill="none" stroke-width="18"></circle>
            <g transform="rotate(-90 70 70)">${segments}</g>
          </svg>
          <div class="ss82-donut-center"><strong>${safe(centerValue)}</strong><small>${safe(centerLabel)}</small></div>
        </div>
        <div class="ss82-donut-legend">
          ${clean.map((r,i)=>`<button type="button" class="ss82-legend-row" data-donut-legend="${i}">
            <i style="--legend-color:${colors[i%colors.length]}"></i>
            <span>${safe(r.label)}</span>
            <b>${(number(r.value)/total*100).toFixed(0)}%</b>
            <small>${safe(formatMoneyUI(r.value,currency))}</small>
          </button>`).join('')}
        </div>
      </div>
    </div>`;
  }

  function expenseDonutFase8(stats, currency) {
    const rows = (stats?.porCategoria || []).filter(x => Number(x.monto) > 0).slice(0,6)

  function filteredEntries() {
    const search = state.filters.search.trim().toLowerCase();
    // En la vista Movimientos mostramos primero lo más recientemente registrado.
    // La fecha contable de la factura se conserva en cada fila, pero no empuja
    // un comprobante recién escaneado al fondo solo por ser de un día anterior.
    return recentActivityEntries().filter(entry => {
      if (entry.kind === 'META') {
        const x = entry.data;
        if (state.filters.type !== 'TODOS' && state.filters.type !== 'META') return false;
        if (state.filters.account && String(x.cuentaId) !== String(state.filters.account)) return false;
        if (state.filters.category) return false;
        if (search) {
          const goal = goalById(x.metaId);
          const account = accountById(x.cuentaId);
          const haystack = [x.descripcion, x.tipo, goal?.nombre, account?.nombre, 'meta'].join(' ').toLowerCase();
          if (!haystack.includes(search)) return false;
        }
        return true;
      }
      if (entry.kind === 'TRANSFERENCIA') {
        const t = entry.data;
        if (state.filters.type !== 'TODOS' && state.filters.type !== 'TRANSFERENCIA') return false;
        if (state.filters.account && String(t.cuentaOrigenId) !== String(state.filters.account) && String(t.cuentaDestinoId) !== String(state.filters.account)) return false;
        if (state.filters.category) return false;
        if (search) {
          const from = accountById(t.cuentaOrigenId);
          const to = accountById(t.cuentaDestinoId);
          const haystack = [t.descripcion, 'transferencia', from?.nombre, to?.nombre].join(' ').toLowerCase();
          if (!haystack.includes(search)) return false;
        }
        return true;
      }

      const m = entry.data;
      if (state.filters.type !== 'TODOS' && m.tipo !== state.filters.type) return false;
      if (state.filters.account && String(m.cuentaId) !== String(state.filters.account)) return false;
      if (state.filters.category && String(m.categoriaId) !== String(state.filters.category)) return false;
      if (search) {
        const cat = categoryById(m.categoriaId);
        const account = accountById(m.cuentaId);
        const haystack = [m.descripcion, cat?.nombre, account?.nombre, m.tipo].join(' ').toLowerCase();
        if (!haystack.includes(search)) return false;
      }
      return true;
    });
  }

  function recurrenceLabel(value) {

  }

  function dueLabelFase6(item) {
    if (item.estado === 'PAUSADO') return 'Pausado';
    if (item.estado === 'FINALIZADO') return 'Finalizado';
    const d = Number(item.diasRestantes);
    if (!Number.isFinite(d)) return item.proximaFecha ? friendly(item.proximaFecha) : 'Sin próxima fecha';
    if (d < 0) return `Atrasado ${Math.abs(d)} día${Math.abs(d)===1?'':'s'}`;
    if (d === 0) return 'Vence hoy';
    if (d === 1) return 'Vence mañana';
    return `En ${d} días`;
  }

    const iconMarkup=cat?.icono ? safe(cat.icono) : icon(item.tipo==='INGRESO'?'refresh':'calendar',20);
    return `<article class="ss81-fixed-row ${item.tipo==='INGRESO'?'income-row':''} ${item.vencido?'overdue':''}" data-recurring-card="${safe(item.id)}">
      <span class="ss81-fixed-icon">${iconMarkup}</span>

  function applyChoiceToneF86(button){

      const buttons=[...wrap.querySelectorAll('.ss81-segment')];
      const idx=Math.max(0,buttons.indexOf(button));
      wrap.classList.toggle('ss86-select-first',idx===0);
      wrap.classList.toggle('ss86-select-second',idx===1);
      wrap.classList.toggle('ss86-tone-income',value==='INGRESO');
      wrap.classList.toggle('ss86-tone-expense',value==='GASTO');
    }
    const modal=button.closest('.modal');
    if(modal && (value==='INGRESO'||value==='GASTO')){
      modal.classList.toggle('ss86-tone-income',value==='INGRESO');
      modal.classList.toggle('ss86-tone-expense',value==='GASTO');
      modal.classList.remove('ss86-tone-pulse');
      void modal.offsetWidth;
      modal.classList.add('ss86-tone-pulse');
      window.setTimeout(()=>modal.classList.remove('ss86-tone-pulse'),620);

  async function submitRecurring(form){

      const result=id?await call('editarRecurrenteFase6Json',id,JSON.stringify(payload)):await call('crearRecurrenteFase6Json',JSON.stringify(payload));
      if(result){const list=allRecurrentes();state.data.recurrentes=[result,...list.filter(x=>String(x.id)!==String(result.id))];}
      closeModal();render();showToast(id?'Gasto fijo actualizado.':'Gasto fijo creado.');
      refreshPlanningFase7({renderWhenDone:true}).then(()=>{state.sectionsLoaded.planificacion=true;}).catch(err=>console.warn('STAR STREAM · Planificación pendiente:',err));
      syncQuickFase7({renderWhenDone:false});
    }catch(err){showToast('No se pudo guardar.',fail(err,'Recurrente'),'error');if(btn)btn.disabled=false;}finally{state.mutating=false;}

  async function planningActionFase6(fn,args=[],success='Actualizado.'){

  // v0.8.18: mobile runtime performance controller.
  const ss812MobileQuery = window.matchMedia ? window.matchMedia('(max-width: 760px)') : {matches:false};
  let ss812PerfObserver = null;
  let ss812ScrollTimer = 0;

  function setupMobilePerformanceFase812() {
    const root = document.documentElement;
    const mobile = Boolean(ss812MobileQuery.matches);
    root.classList.toggle('ss812-mobile-perf', mobile);

    if (ss812PerfObserver) {
      ss812PerfObserver.disconnect();
      ss812PerfObserver = null;
    }
    if (!mobile || !('IntersectionObserver' in window)) return;

    const targets = document.querySelectorAll([
      '#view .ss82-chart-row',
      '#view .ss82-dashboard-lower',
      '#view .ss82-dashboard-bottom',
      '#view .ss82-accounts-bottom',
      '#view .ss82-stats-main',
      '#view .ss82-stats-lower',
      '#view .f8-planning-main',
      '#view .f8-planning-secondary',
      '#view .premium-chart-shell',
      '#view .ss82-donut-shell'
    ].join(','));

    ss812PerfObserver = new IntersectionObserver(entries => {
      entries.forEach(entry => entry.target.classList.toggle('ss812-offscreen', !entry.isIntersecting));
    }, {root:null, rootMargin:'180px 0px', threshold:0.01});
    targets.forEach(node => ss812PerfObserver.observe(node));
  }

  function ss812HandleScroll() {
    if (!ss812MobileQuery.matches) return;
    const root = document.documentElement;
    root.classList.add('ss812-scrolling');
    clearTimeout(ss812ScrollTimer);
    ss812ScrollTimer = setTimeout(() => root.classList.remove('ss812-scrolling'), 110);
  }

  window.addEventListener('scroll', ss812HandleScroll, {passive:true});
  if (ss812MobileQuery.addEventListener) ss812MobileQuery.addEventListener('change', setupMobilePerformanceFase812);
  else if (ss812MobileQuery.addListener) ss812MobileQuery.addListener(setupMobilePerformanceFase812);
  document.documentElement.classList.toggle('ss812-tab-hidden', document.hidden);

  function mergeFullDataFase524(full) {
    state.data = normalizeData(full);
    state.fullLoaded = true;
    Object.keys(state.sectionsLoaded||{}).forEach(k=>state.sectionsLoaded[k]=true);
    saveBootstrapCacheFase7();
    return state.data;
  }

  let quickSyncInFlightFase7 = null;
  let backgroundFullSyncTimerFase7 = null;

  function mergeQuickPatchFase7(patch) {
    if (!state.data || !patch) return state.data;
    if (patch.configuracion) state.data.configuracion = patch.configuracion;
    if (Array.isArray(patch.categorias)) state.data.categorias = patch.categorias;
    if (Array.isArray(patch.categoriasTodas)) state.data.categoriasTodas = patch.categoriasTodas;
    if (Array.isArray(patch.cuentasTodas)) state.data.cuentasTodas = patch.cuentasTodas;
    if (Array.isArray(patch.metas)) state.data.metas = patch.metas;
    if (Array.isArray(patch.movimientosMetas)) state.data.movimientosMetas = patch.movimientosMetas;
    if (patch.resumen) {
      state.data.resumen = {...(state.data.resumen || {}), ...patch.resumen};
      const recentMovs=Array.isArray(patch.resumen.movimientosRecientes)?patch.resumen.movimientosRecientes:[];
      if(recentMovs.length){const ids=new Set(recentMovs.map(x=>String(x.id)));state.data.movimientos=[...recentMovs,...(state.data.movimientos||[]).filter(x=>!ids.has(String(x.id)))];}
      const recentTransfers=Array.isArray(patch.resumen.transferenciasRecientes)?patch.resumen.transferenciasRecientes:[];
      if(recentTransfers.length){const ids=new Set(recentTransfers.map(x=>String(x.id)));state.data.transferencias=[...recentTransfers,...(state.data.transferencias||[]).filter(x=>!ids.has(String(x.id)))];}
    }
    if (patch.resumenPlanificacion) state.data.resumenPlanificacion=patch.resumenPlanificacion;
    saveBootstrapCacheFase7();
    return state.data;
  }

  function syncQuickFase7({ renderWhenDone = true } = {}) {
    if (!state.data) return Promise.resolve(null);
    if (quickSyncInFlightFase7) return quickSyncInFlightFase7;
    const started = performance.now();
    quickSyncInFlightFase7 = call('obtenerActualizacionRapidaFase7')
      .then(patch => {
        mergeQuickPatchFase7(patch);
        if (renderWhenDone) render();
        console.debug(`STAR STREAM · sync rápido ${(performance.now()-started).toFixed(0)} ms`);
        return patch;
      })
      .catch(err => { console.warn('STAR STREAM · Sync rápido pendiente:',err); return null; })
      .finally(() => { quickSyncInFlightFase7 = null; });
    return quickSyncInFlightFase7;
  }

  function backgroundFullSyncFase7(delay = 900) {
    clearTimeout(backgroundFullSyncTimerFase7);
    backgroundFullSyncTimerFase7 = setTimeout(() => {
      if (state.fullLoading) return;
      const started = performance.now();
      state.fullLoading = call('obtenerDatosFase6')
        .then(full => {
          mergeFullDataFase524(full);
          if (!$('#modalRoot')?.innerHTML) render();
          console.debug(`STAR STREAM · sync completo ${(performance.now()-started).toFixed(0)} ms`);
        })
        .catch(err => console.warn('STAR STREAM · Sync completo en segundo plano:',err))
        .finally(() => { state.fullLoading = null; });
    }, delay);
  }

  function refreshPlanningFase7({ renderWhenDone = true } = {}) {
    return call('obtenerPlanificacionRapidaFase7').then(plan => {
      if (!state.data || !plan) return plan;
      state.data.recurrentes = Array.isArray(plan.recurrentes) ? plan.recurrentes : [];
      state.data.presupuestos = Array.isArray(plan.presupuestos) ? plan.presupuestos : [];
      state.data.notificaciones = Array.isArray(plan.notificaciones) ? plan.notificaciones : [];
      state.data.resumenPlanificacion = plan.resumen || null;
      state.data.triggerFase6 = {activo:Boolean(plan.triggerActivo)};
      updateNotificationBadgeFase6();
      if (renderWhenDone) render();
      return plan;
    });
  }

  function loadDashboardExtraFase7({renderWhenDone=true}={}) {
    if (state.sectionsLoaded.dashboard) return Promise.resolve(state.data);
    return call('obtenerDashboardExtraFase7').then(extra => {
      if (!state.data || !extra) return state.data;
      ['movimientos','transferencias','movimientosMetas','metas','notificaciones'].forEach(k=>{
        if (Array.isArray(extra[k])) state.data[k]=extra[k];
      });
      if (extra.estadisticas) state.data.estadisticas=extra.estadisticas;
      if (extra.resumenPlanificacion) state.data.resumenPlanificacion=extra.resumenPlanificacion;
      if (extra.triggerFase6) state.data.triggerFase6=extra.triggerFase6;
      state.sectionsLoaded.dashboard=true;
      updateNotificationBadgeFase6();
      if (renderWhenDone && state.page==='inicio') render();
      return state.data;
    });
  }

  function loadMovementsSectionFase7({renderWhenDone=true}={}) {
    if (state.sectionsLoaded.movimientos) return Promise.resolve(state.data);
    return call('obtenerMovimientosSeccionFase7').then(extra => {
      if (!state.data || !extra) return state.data;
      ['movimientos','transferencias','movimientosMetas','comprobantes'].forEach(k=>{
        if (Array.isArray(extra[k])) state.data[k]=extra[k];

  function loadFullDataFase524({ renderWhenDone = true } = {}) {
    if (state.fullLoaded && state.data) return Promise.resolve(state.data);
    if (state.fullLoading) return state.fullLoading;

    state.fullLoading = call('obtenerDatosFase6')
      .then(full => {
        mergeFullDataFase524(full);
        if (renderWhenDone) render();
        return state.data;
      })
      .catch(err => {
        console.error('STAR STREAM · Hidratación completa:', err);
        throw err;
      })
      .finally(() => { state.fullLoading = null; });

    return state.fullLoading;
  }

  function scheduleFullHydrationFase524() {
    const run = () => loadDashboardExtraFase7({renderWhenDone:true}).catch(err => {
      console.warn('STAR STREAM · Extras del dashboard pendientes:', err);
    });
    if ('requestIdleCallback' in window) {
      window.requestIdleCallback(run, { timeout: 1400 });
    } else {
      setTimeout(run, 650);
    }
    // El mantenimiento de automatizaciones ocurre aparte y nunca bloquea el primer render.
    setTimeout(() => call('procesarMantenimientoFase7')
      .then(()=>syncNotificationsFase611({rerender:state.page==='planificacion'}))
      .catch(err=>console.warn('STAR STREAM · Mantenimiento en segundo plano:',err)), 3200);
  }

  async function refresh({ silent = false, full = false } = {}) {
    if (state.busy) return;
    if (silent && state.data && !full) {
      await syncQuickFase7({renderWhenDone:true});
      backgroundFullSyncFase7(1200);
      return;
    }
    state.busy = true;
    if (!silent && !state.data) showSkeleton();
    try {
      const mustLoadFull = full || state.page !== 'inicio' || state.fullLoaded;
      if (mustLoadFull) {
        state.data = normalizeData(await call('obtenerDatosFase6'));
        state.fullLoaded = true;
        render();
      } else {
        // Primer render: saldo y resumen primero. El resto llega en segundo plano.
        state.data = normalizeData(await call('obtenerInicioRapidoFase6'));
        saveBootstrapCacheFase7();
        render();
        scheduleFullHydrationFase524();
      }
    } catch (err) {
      const message = fail(err, 'Carga inicial');
      $('#view').innerHTML = renderError(message);
      showToast('No se pudo cargar la información.', message, 'error');
    } finally {
      state.busy = false;
    }
  }

  async function refreshStats() {
    if (state.busy || state.mutating) return;
    state.busy = true;
    try {
      const payload = JSON.stringify({rango:state.statsRange,moneda:state.statsCurrency || currentConfig().monedaPrincipal || 'DOP'});
      state.data.estadisticas = await call('obtenerEstadisticasFase4Json', payload);
      if (state.page === 'estadisticas') render();
    } catch (err) {
      showToast('No se pudieron actualizar las estadísticas.', fail(err,'Estadísticas'), 'error');

  function showToast(title, text = '', type = 'success') {

    const iconName = type === 'success' ? 'check' : type === 'error' ? 'alert' : 'info';

    state.toastTimer = setTimeout(() => { region.innerHTML = ''; }, 5200);

  function go(page) {
    if (!pageMeta[page]) return;
    state.page = page;
    updateNavigation();
    updateHeader();

    const failSection = err => {
      const message=fail(err,'Carga de sección');
      $('#view').innerHTML=renderError(message);
    };

    if (page === 'inicio') {
      render();
      if (!state.sectionsLoaded.dashboard) loadDashboardExtraFase7({renderWhenDone:true}).catch(failSection);
    } else if (page === 'movimientos' && !state.sectionsLoaded.movimientos) {
      showSkeleton();
      loadMovementsSectionFase7({renderWhenDone:true}).catch(failSection);
    } else if (page === 'planificacion') {
      if (!state.sectionsLoaded.planificacion) showSkeleton(); else render();
      refreshPlanningFase7({renderWhenDone:true}).then(()=>{state.sectionsLoaded.planificacion=true;}).catch(failSection);
    } else if (page === 'estadisticas') {
      render();
      refreshStats();
    } else if (['cuentas','metas','configuracion'].includes(page) && !state.sectionsLoaded[page]) {
      showSkeleton();
      syncQuickFase7({renderWhenDone:true}).then(()=>{state.sectionsLoaded[page]=true;}).catch(failSection);
    } else {
      render();
    }
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }

  function updateTransferExchangePreview() {
    const origin = accountById($('#transferOrigin')?.value);
    const destination = accountById($('#transferDestination')?.value);
    const amount = Number($('#transferAmount')?.value || 0);
    const box = $('#transferExchangeBox');
    const rateField = $('#transferRate');
    const preview = $('#transferConversionPreview');
    if (!origin || !destination || !box || !rateField || !preview) return;
    const from = accountCurrency(origin), to = accountCurrency(destination);
    const cross = from !== to;
    box.hidden = !cross;
    if (!cross) {
      preview.textContent = amount > 0 ? `${formatMoney(amount,from)} → ${formatMoney(amount,to)}` : `Misma moneda: ${from}`;
      return;
    }
    const supported = new Set([from,to]).has('USD') && new Set([from,to]).has('DOP') && new Set([from,to]).size === 2;
    if (!supported) {
      preview.textContent = `Conversión ${from} → ${to} todavía no compatible.`;
      return;
    }
    const rate = Number(rateField.value || configuredUsdDopRate());
    const converted = convertCurrencyAmount(amount,from,to,rate);
    preview.textContent = Number.isFinite(converted) && amount > 0
      ? `${formatMoney(amount,from)} → ${formatMoney(converted,to)} · 1 USD = RD$ ${rate.toFixed(2)}`
      : `1 USD = RD$ ${rate.toFixed(2)}`;
  }

      if (entry.kind === 'META') {
        return String(entry.data.cuentaId) === String(accountId);
      }
      return String(entry.data.cuentaId) === String(accountId);
    });

  function setFormBusy(form, busy) {
    $$('button, input, select, textarea', form).forEach(el => el.disabled = busy);
  }

  function focusInvalidField(form, name, message) {
    const field = form.elements?.[name];
    if (!field) return false;
    field.setCustomValidity(message);
    field.reportValidity();
    field.focus();
    const clear = () => {
      field.setCustomValidity('');
      field.removeEventListener('input', clear);
      field.removeEventListener('change', clear);
    };
    field.addEventListener('input', clear);
    field.addEventListener('change', clear);
    return true;
  }

  function validateAccountPayload(form, payload) {
    if (payload.nombre.length < 1 || payload.nombre.length > 80) return focusInvalidField(form, 'nombre', 'Introduce un nombre de entre 1 y 80 caracteres.') && false;
    if (!['Banco', 'Efectivo', 'Ahorro', 'Otro'].includes(payload.tipo)) return focusInvalidField(form, 'tipo', 'Selecciona un tipo de cuenta válido.') && false;
    if (!/^[A-Z]{3}$/.test(payload.moneda)) return focusInvalidField(form, 'moneda', 'Usa un código de moneda de 3 letras, por ejemplo DOP.') && false;
    if (!Number.isFinite(payload.saldoInicial) || payload.saldoInicial < 0) return focusInvalidField(form, 'saldoInicial', 'El saldo inicial debe ser 0 o un número mayor.') && false;
    return true;
  }

  function validateMovementPayload(form, payload) {
    if (!['INGRESO', 'GASTO'].includes(payload.tipo)) return focusInvalidField(form, 'tipo', 'Selecciona Ingreso o Gasto.') && false;
    if (!Number.isFinite(payload.monto) || payload.monto <= 0) return focusInvalidField(form, 'monto', 'El monto debe ser mayor que 0.') && false;
    if (!payload.cuentaId) return focusInvalidField(form, 'cuentaId', 'Selecciona una cuenta.') && false;
    if (!payload.categoriaId) return focusInvalidField(form, 'categoriaId', 'Selecciona una categoría.') && false;
    if (!/^\d{4}-\d{2}-\d{2}$/.test(payload.fecha)) return focusInvalidField(form, 'fecha', 'Selecciona una fecha válida.') && false;
    return true;
  }

  function validateTransferPayload(form, payload) {
    if (!Number.isFinite(payload.monto) || payload.monto <= 0) return focusInvalidField(form, 'monto', 'El monto debe ser mayor que 0.') && false;
    if (!payload.cuentaOrigenId) return focusInvalidField(form, 'cuentaOrigenId', 'Selecciona una cuenta de origen.') && false;
    if (!payload.cuentaDestinoId) return focusInvalidField(form, 'cuentaDestinoId', 'Selecciona una cuenta de destino.') && false;
    if (payload.cuentaOrigenId === payload.cuentaDestinoId) return focusInvalidField(form, 'cuentaDestinoId', 'Origen y destino deben ser diferentes.') && false;
    const origin = accountById(payload.cuentaOrigenId), dest = accountById(payload.cuentaDestinoId);
    if (origin && dest && accountCurrency(origin) !== accountCurrency(dest)) {
      const currencies = new Set([accountCurrency(origin),accountCurrency(dest)]);
      if (!(currencies.has('USD') && currencies.has('DOP') && currencies.size===2)) return focusInvalidField(form, 'cuentaDestinoId', 'Por ahora la conversión entre monedas distintas admite DOP y USD.') && false;
      if (!Number.isFinite(payload.tasaCambio) || payload.tasaCambio <= 0) return focusInvalidField(form, 'tasaCambio', 'Introduce una tasa USD/DOP válida.') && false;
    }
    if (!/^\d{4}-\d{2}-\d{2}$/.test(payload.fecha)) return focusInvalidField(form, 'fecha', 'Selecciona una fecha válida.') && false;
    return true;
  }

  function validateCategoryPayload(form, payload) {
    if (!payload.nombre || payload.nombre.length > 60) return focusInvalidField(form, 'nombre', 'Introduce un nombre de entre 1 y 60 caracteres.') && false;
    if (!['INGRESO','GASTO'].includes(payload.tipo)) return focusInvalidField(form, 'tipo', 'Selecciona Ingreso o Gasto.') && false;

  function validateGoalPayload(form,payload) {

  function validateGoalMovementPayload(form,payload) {

  function adjustAccountBalanceLocalFase7(accountId, delta) {
    if (!state.data || !Number.isFinite(Number(delta))) return;
    const seen = new Set();
    [state.data.cuentasTodas, state.data.resumen?.cuentas].forEach(list => {
      (Array.isArray(list) ? list : []).forEach(account => {
        if (String(account.id) !== String(accountId) || seen.has(account)) return;
        seen.add(account);
        account.saldo = number(account.saldo) + Number(delta);
      });
    });
  }

  function applyMovementEffectLocalFase7(m, direction = 1) {
    if (!m || !state.data?.resumen) return;
    const account = accountById(m.cuentaId);
    const amount = number(m.monto);
    const signed = (m.tipo === 'INGRESO' ? 1 : -1) * amount * direction;
    adjustAccountBalanceLocalFase7(m.cuentaId, signed);

    const main = String(currentConfig().monedaPrincipal || state.data.resumen.monedaTotal || 'DOP').toUpperCase();
    const converted = convertCurrencyAmount(amount, accountCurrency(account), main);
    if (!Number.isFinite(converted)) return;
    const signedMain = (m.tipo === 'INGRESO' ? 1 : -1) * converted * direction;
    if (Number.isFinite(Number(state.data.resumen.saldoTotal))) state.data.resumen.saldoTotal = number(state.data.resumen.saldoTotal) + signedMain;
    if (Number.isFinite(Number(state.data.resumen.patrimonioTotal))) state.data.resumen.patrimonioTotal = number(state.data.resumen.patrimonioTotal) + signedMain;

    const month = dateKey(m.fecha).slice(0,7);
    if (month && month === String(state.data.resumen.periodo || '')) {
      if (m.tipo === 'INGRESO' && Number.isFinite(Number(state.data.resumen.ingresosPeriodo))) state.data.resumen.ingresosPeriodo = number(state.data.resumen.ingresosPeriodo) + converted * direction;
      if (m.tipo === 'GASTO' && Number.isFinite(Number(state.data.resumen.gastosPeriodo))) state.data.resumen.gastosPeriodo = number(state.data.resumen.gastosPeriodo) + converted * direction;
    }
    const first6 = monthKeyOffset(-5);
    if (month && month >= first6 && month <= todayISO().slice(0,7) && Number.isFinite(Number(state.data.resumen.ahorroNeto6Meses))) {
      state.data.resumen.ahorroNeto6Meses = number(state.data.resumen.ahorroNeto6Meses) + signedMain;
    }
  }

  function applyMovementLocalFase7(movement, previous = null) {
    if (!state.data || !movement) return;
    if (previous) applyMovementEffectLocalFase7(previous,-1);
    applyMovementEffectLocalFase7(movement,1);
    const current = Array.isArray(state.data.movimientos) ? state.data.movimientos : [];
    state.data.movimientos = [movement, ...current.filter(x => String(x.id) !== String(movement.id))];
    state.data.resumen.movimientosRecientes = state.data.movimientos.slice().sort((a,b) => String(b.fechaActualizacion || b.fechaCreacion || '').localeCompare(String(a.fechaActualizacion || a.fechaCreacion || ''))).slice(0,6);
  }

  function applyTransferEffectLocalFase7(t, direction = 1) {
    if (!t || !state.data?.resumen) return;
    const from = accountById(t.cuentaOrigenId), to = accountById(t.cuentaDestinoId);
    const out = number(t.monto), incoming = number(t.montoDestino || t.monto);
    adjustAccountBalanceLocalFase7(t.cuentaOrigenId,-out*direction);
    adjustAccountBalanceLocalFase7(t.cuentaDestinoId,incoming*direction);
    const main = String(currentConfig().monedaPrincipal || state.data.resumen.monedaTotal || 'DOP').toUpperCase();
    const outMain = convertCurrencyAmount(out,accountCurrency(from),main);
    const inMain = convertCurrencyAmount(incoming,accountCurrency(to),main);
    if (Number.isFinite(outMain) && Number.isFinite(inMain)) {
      const delta = (inMain-outMain)*direction;
      if (Number.isFinite(Number(state.data.resumen.saldoTotal))) state.data.resumen.saldoTotal = number(state.data.resumen.saldoTotal)+delta;
      if (Number.isFinite(Number(state.data.resumen.patrimonioTotal))) state.data.resumen.patrimonioTotal = number(state.data.resumen.patrimonioTotal)+delta;
    }
  }

  function applyTransferLocalFase7(transfer, previous = null) {
    if (!state.data || !transfer) return;
    if (previous) applyTransferEffectLocalFase7(previous,-1);
    applyTransferEffectLocalFase7(transfer,1);
    const current = Array.isArray(state.data.transferencias) ? state.data.transferencias : [];
    state.data.transferencias = [transfer,...current.filter(x=>String(x.id)!==String(transfer.id))];
    state.data.resumen.transferenciasRecientes = state.data.transferencias.slice(0,6);
  }

  async function submitMovement(form) {
    if (state.mutating || !form.reportValidity()) return;
    const fd = new FormData(form);
    const payload = {
      tipo: String(fd.get('tipo') || ''),
      monto: Number(fd.get('monto')),
      cuentaId: String(fd.get('cuentaId') || ''),
      categoriaId: String(fd.get('categoriaId') || ''),
      fecha: String(fd.get('fecha') || ''),
      descripcion: String(fd.get('descripcion') || '').trim()
    };
    if (!validateMovementPayload(form, payload)) return;
    const editing = form.dataset.editing === 'true';
    const id = form.dataset.id;
    state.mutating = true;
    setFormBusy(form, true);
    try {
      const previous = editing ? (state.data?.movimientos || []).find(x => String(x.id) === String(id)) : null;
      const result = editing
        ? await call('editarMovimientoFase2', id, JSON.stringify(payload))
        : await call('crearMovimientoFase2', JSON.stringify(payload));
      applyMovementLocalFase7(result || {id,...payload,fechaCreacion:new Date().toISOString(),fechaActualizacion:new Date().toISOString()}, previous);
      closeModal();
      render();
      showToast(editing ? 'Movimiento actualizado.' : 'Movimiento registrado correctamente.');
      syncQuickFase7({renderWhenDone:true});
    } catch (err) {
      showToast('No se pudo guardar el movimiento.', fail(err, editing ? 'Editar movimiento' : 'Crear movimiento'), 'error');
      setFormBusy(form, false);
    } finally { state.mutating = false; }
  }

  async function submitTransfer(form) {
    if (state.mutating || !form.reportValidity()) return;
    const fd = new FormData(form);
    const payload = {
      monto: Number(fd.get('monto')),
      cuentaOrigenId: String(fd.get('cuentaOrigenId') || ''),

      descripcion: String(fd.get('descripcion') || '').trim()
    };
    if (!validateTransferPayload(form, payload)) return;
    const editing = form.dataset.editing === 'true';
    const id = form.dataset.id;
    state.mutating = true;
    setFormBusy(form, true);
    try {

      const result = editing
        ? await call('editarTransferenciaFase3', id, JSON.stringify(payload))
        : await call('crearTransferenciaFase3', JSON.stringify(payload));

      render();

      setFormBusy(form, false);
    } finally { state.mutating = false; }
  }

  function readFileAsDataUrl(file) {
    return new Promise((resolve, reject) => {
      const reader = new FileReader();
      reader.onload = () => resolve(String(reader.result || ''));
      reader.onerror = () => reject(new Error('No se pudo leer la imagen seleccionada.'));
      reader.readAsDataURL(file);
    });
  }

  function loadImageFromDataUrl(src) {
    return new Promise((resolve, reject) => {
      const img = new Image();
      img.onload = () => resolve(img);
      img.onerror = () => reject(new Error('La imagen seleccionada no se pudo abrir.'));
      img.src = src;
    });
  }

  function drawSquareAvatar(img, size, quality) {
    const canvas = document.createElement('canvas');
    canvas.width = size;
    canvas.height = size;
    const ctx = canvas.getContext('2d', { alpha: false });
    if (!ctx) throw new Error('El navegador no pudo preparar la imagen.');
    const width = img.naturalWidth || img.width;
    const height = img.naturalHeight || img.height;
    const side = Math.min(width, height);
    const sx = Math.max(0, (width - side) / 2);
    const sy = Math.max(0, (height - side) / 2);
    ctx.fillStyle = '#0d1636';
    ctx.fillRect(0, 0, size, size);
    ctx.drawImage(img, sx, sy, side, side, 0, 0, size, size);
    return canvas.toDataURL('image/jpeg', quality);
  }

  async function compressProfilePhoto(file) {
    if (!file) throw new Error('Selecciona una imagen.');
    const allowed = ['image/jpeg','image/png','image/webp'];
    if (!allowed.includes(String(file.type || '').toLowerCase())) throw new Error('Usa una imagen JPG, PNG o WebP.');
    if (file.size > 8 * 1024 * 1024) throw new Error('La imagen original no puede superar 8 MB.');
    const src = await readFileAsDataUrl(file);
    const img = await loadImageFromDataUrl(src);
    if (!(img.naturalWidth > 0 && img.naturalHeight > 0)) throw new Error('La imagen seleccionada no es válida.');
    const attempts = [[256,.82],[224,.78],[192,.74],[160,.70],[144,.66],[128,.62]];
    for (const [size, quality] of attempts) {
      const result = drawSquareAvatar(img, size, quality);
      if (result.length <= 43000) return result;
    }
    throw new Error('No se pudo reducir la imagen lo suficiente. Prueba con otra foto.');
  }

  async function imageCanvasFase52(dataUrl,maxSide=1800,ocrMode=false) {
    const img=await loadImageFromDataUrl(dataUrl);
    const w=img.naturalWidth||img.width, h=img.naturalHeight||img.height;
    const scale=Math.min(1,maxSide/Math.max(w,h));
    const canvas=document.createElement('canvas');
    canvas.width=Math.max(1,Math.round(w*scale));
    canvas.height=Math.max(1,Math.round(h*scale));
    const ctx=canvas.getContext('2d',{alpha:false,willReadFrequently:true});
    if(!ctx)throw new Error('El navegador no pudo preparar la imagen.');
    ctx.fillStyle='#fff';
    ctx.fillRect(0,0,canvas.width,canvas.height);
    if(ocrMode){
      try{ctx.filter='grayscale(1) contrast(1.35)';}catch(_){}
    }
    ctx.drawImage(img,0,0,canvas.width,canvas.height);
    return {canvas,ctx};
  }

  async function detectarQrFacturaFase52(dataUrl) {
    try{
      const {canvas,ctx}=await imageCanvasFase52(dataUrl,1800,false);

      if ('BarcodeDetector' in window) {
        try{
          const detector=new BarcodeDetector({formats:['qr_code']});
          const results=await detector.detect(canvas);
          const raw=results?.find(x=>x.rawValue)?.rawValue||'';
          if(raw)return raw;
        }catch(_){}
      }

      await ensureJsQrFase52();
      const imageData=ctx.getImageData(0,0,canvas.width,canvas.height);
      const code=window.jsQR(imageData.data,canvas.width,canvas.height,{inversionAttempts:'attemptBoth'});
      return code?.data||'';
    }catch(err){
      console.warn('STAR STREAM · QR:',err);
      return '';
    }
  }

  async function detectarQrsFacturaFase52(files,button) {

    for(let i=0;i<files.length;i++){

      if(button)button.textContent=`Buscando QR ${i+1}/${files.length}…`;

      if(raw && !out.includes(raw))out.push(raw);

    return out;
  }

  async function imagenParaOcrLocalFase52(dataUrl, rotation=0) {
    const {canvas:source}=await imageCanvasFase52(dataUrl,2200,true);
    const normalized=((Number(rotation)||0)%360+360)%360;
    if (!normalized) {
      return {dataUrl:source.toDataURL('image/jpeg',.9),width:source.width,height:source.height};
    }

    const swap=normalized===90 || normalized===270;
    const canvas=document.createElement('canvas');
    canvas.width=swap?source.height:source.width;
    canvas.height=swap?source.width:source.height;
    const ctx=canvas.getContext('2d',{alpha:false});
    if(!ctx)throw new Error('El navegador no pudo rotar la imagen para OCR.');
    ctx.fillStyle='#fff';ctx.fillRect(0,0,canvas.width,canvas.height);
    ctx.save();
    if(normalized===90){ctx.translate(canvas.width,0);ctx.rotate(Math.PI/2);}
    else if(normalized===180){ctx.translate(canvas.width,canvas.height);ctx.rotate(Math.PI);}
    else if(normalized===270){ctx.translate(0,canvas.height);ctx.rotate(-Math.PI/2);}
    ctx.drawImage(source,0,0);
    ctx.restore();
    return {dataUrl:canvas.toDataURL('image/jpeg',.9),width:canvas.width,height:canvas.height};
  }

  function scoreReceiptOcrFase523(text, confidence=0) {
    const s=String(text||'').trim();
    if(!s)return -1;
    let score=Number(confidence)||0;
    score+=Math.min(240,s.length/5);
    if(/\b(total|monto|pagado|pagar|importe|fecha|comprobante|factura|empresa|cuenta|recibo|rnc)\b/i.test(s))score+=170;
    if(/(?:RD\$|DOP|US\$|USD|\$)?\s*[0-9]{1,3}(?:[.,][0-9]{3})*(?:[.,][0-9]{2})/i.test(s))score+=220;
    if(/\b(total\s+(?:pagad[oa]|a\s+pagar|general)|monto\s+total|importe\s+(?:total|en\s+rd\$?)|valor\s+total|balance\s+due|amount\s+due)\b/i.test(s))score+=300;
    return score;
  }

  function hasReceiptTotalFase523(text) {
    const s=String(text||'');
    return /\b(total\s+(?:pagad[oa]|a\s+pagar|general)|monto\s+total|importe\s+(?:total|en\s+rd\$?)|valor\s+total|balance\s+due|amount\s+due)\b/i.test(s) &&
      /(?:RD\$|DOP|US\$|USD|\$)?\s*[0-9]{1,3}(?:[.,][0-9]{3})*(?:[.,][0-9]{2})/i.test(s);
  }

  async function ocrLocalFacturaFase52(files,button) {
    const images=files.filter(f=>String(f.mime||'').startsWith('image/'));
    if(!images.length)return '';
    try{
      await ensureTesseractFase52();
    }catch(err){
      console.warn('STAR STREAM · OCR local no disponible:',err);
      return '';
    }

    let worker=null;
    const chunks=[];
    try{
      if(button)button.textContent='Preparando lectura alternativa…';
      worker=await window.Tesseract.createWorker('spa',1,{
        logger:m=>{
          if(button && m?.status==='recognizing text' && Number.isFinite(m.progress)){
            button.textContent=`Leyendo texto ${Math.round(m.progress*100)}%…`;
          }
        }
      });
      try{await worker.setParameters({preserve_interword_spaces:'1'});}catch(_){}

      for(let i=0;i<images.length;i++){
        const image=await loadImageFromDataUrl(images[i].dataUrl);
        const w=image.naturalWidth||image.width;
        const h=image.naturalHeight||image.height;

        // Siempre probamos orientación normal. Si ahí no aparece un total claro,
        // probamos 90° y -90°. Así no dependemos de que la cámara haya guardado
        // correctamente la orientación EXIF.
        const rotations=[0,90,270];
        const variants=[];

        for(const rotation of rotations){
          if(button)button.textContent=`OCR ${i+1}/${images.length}${rotation?` · rotando ${rotation===90?'90°':'-90°'}`:''}…`;
          const prepared=await imagenParaOcrLocalFase52(images[i].dataUrl,rotation);
          const result=await worker.recognize(prepared.dataUrl);
          const pageText=String(result?.data?.text||'').trim();
          if(!pageText)continue;
          const score=scoreReceiptOcrFase523(pageText,result?.data?.confidence);
          variants.push({text:pageText,score,rotation});
          if(rotation===0 && hasReceiptTotalFase523(pageText))break;
          if(rotation!==0 && hasReceiptTotalFase523(pageText))break;
        }

        variants.sort((a,b)=>b.score-a.score);
        if(variants.length){
          const primary=variants[0];
          chunks.push(`PÁGINA ${i+1} · ORIENTACIÓN ${primary.rotation}°
${primary.text}`);

          // Si ninguna lectura encontró un total explícito, conservamos una
          // segunda variante. El backend compara señales y repetición de montos
          // en vez de depender de una única lectura OCR.
          if(!variants.some(v=>hasReceiptTotalFase523(v.text)) && variants[1]?.text){
            chunks.push(`PÁGINA ${i+1} · LECTURA SECUNDARIA ${variants[1].rotation}°
${variants[1].text}`);
          }
        }
      }
    }catch(err){
      console.warn('STAR STREAM · OCR local:',err);
    }finally{
      if(worker){try{await worker.terminate();}catch(_){}}
    }
    return chunks.join('\n\n').slice(0,45000);
  }

  async function prepareReceiptData(file) {
    if (!file) throw new Error('Selecciona una foto o PDF.');
    const type = String(file.type || '').toLowerCase();
    if (!['image/jpeg','image/png','application/pdf'].includes(type)) throw new Error('Usa JPG, PNG o PDF.');

    if (type === 'application/pdf') {
      if (file.size > 5 * 1024 * 1024) throw new Error('Cada PDF debe pesar 5 MB o menos.');
      return {dataUrl:await readFileAsDataUrl(file),mime:type,name:file.name||'comprobante.pdf'};
    }

    if (file.size > 20 * 1024 * 1024) throw new Error('La foto es demasiado grande. Usa una imagen de menos de 20 MB.');
    const src = await readFileAsDataUrl(file);
    const img = await loadImageFromDataUrl(src);
    const originalW=img.naturalWidth||img.width, originalH=img.naturalHeight||img.height;
    const maxSide=3200;
    let scale=Math.min(1,maxSide/Math.max(originalW,originalH));
    let width=Math.max(1,Math.round(originalW*scale));
    let height=Math.max(1,Math.round(originalH*scale));
    let quality=.92;
    let dataUrl='';

    for(let attempt=0;attempt<4;attempt++){
      const canvas=document.createElement('canvas');
      canvas.width=width;canvas.height=height;
      const ctx=canvas.getContext('2d',{alpha:false});
      if(!ctx) throw new Error('El navegador no pudo preparar la imagen.');
      ctx.fillStyle='#fff';ctx.fillRect(0,0,width,height);
      try{ctx.filter='contrast(1.06) saturate(.92)';}catch(_){}
      ctx.drawImage(img,0,0,width,height);
      dataUrl=canvas.toDataURL('image/jpeg',quality);
      if(receiptDataUrlBytes(dataUrl)<=4.5*1024*1024) break;
      quality=Math.max(.72,quality-.08);
      width=Math.max(1,Math.round(width*.88));
      height=Math.max(1,Math.round(height*.88));
    }

    if(receiptDataUrlBytes(dataUrl)>5*1024*1024) throw new Error('No se pudo comprimir la foto por debajo de 5 MB.');
    return {dataUrl,mime:'image/jpeg',name:(file.name||'comprobante').replace(/\.[^.]+$/,'')+'.jpg'};
  }

  async function analyzeReceipt(button) {
    const files=state.pendingReceiptFiles||[];
    if (state.mutating || !files.length) return;
    state.mutating=true;
    if(button)button.disabled=true;
    let loteId='';
    const originalLabel=button?.innerHTML||'Analizar factura';
    try {
      const qrValues=await detectarQrsFacturaFase52(files,button);

      const lote=await call('iniciarLoteComprobanteFase51',JSON.stringify({cantidad:files.length}));
      loteId=String(lote?.id||'');
      if(!loteId)throw new Error('No se pudo iniciar el lote del comprobante.');

      for(let i=0;i<files.length;i++){
        if(button)button.textContent=`Analizando ${i+1}/${files.length}…`;
        const data=files[i];
        await call('subirPaginaLoteComprobanteFase51',loteId,JSON.stringify({
          dataUrl:data.dataUrl,
          nombreArchivo:data.name,
          pagina:i+1,
          totalPaginas:files.length
        }));
      }

      if(button)button.textContent='Uniendo resultados…';
      let receipt=await call('finalizarLoteComprobanteFase51',loteId);

      const needsAlternative =
        !receipt?.tieneOCR ||
        !number(receipt?.montoDetectado) ||
        !receipt?.fechaDetectada ||
        !String(receipt?.comercioDetectado||'').trim();

      if(needsAlternative || qrValues.length){
        let textoAlternativo='';
        if(needsAlternative){
          textoAlternativo=await ocrLocalFacturaFase52(files,button);
        }
        if(button)button.textContent='Confirmando datos…';
        receipt=await call(
          'mejorarComprobanteFase52',
          loteId,
          JSON.stringify({textoOCR:textoAlternativo,qrValues})
        );
      }

      state.pendingReceiptFiles=[];
      openReceiptReview(receipt);
    } catch(err){
      if(loteId){try{await call('cancelarLoteComprobanteFase51',loteId);}catch(_){}}
      showToast('No se pudo analizar la factura.',fail(err,'OCR híbrido'),'error');
      if(button){button.disabled=false;button.innerHTML=originalLabel;}
    } finally{
      state.mutating=false;
    }
  }

    const confirmRecurringBtn = event.target.closest('[data-confirm-recurring]');
    if(confirmRecurringBtn){planningActionFase6('confirmarRecurrenteFase6',[confirmRecurringBtn.dataset.confirmRecurring],'Movimiento registrado y próxima fecha calculada.');return;}
    const skipRecurringBtn = event.target.closest('[data-skip-recurring]');
    if(skipRecurringBtn){planningActionFase6('omitirRecurrenteFase6',[skipRecurringBtn.dataset.skipRecurring],'Ocurrencia omitida.');return;}
    const editBudgetBtn = event.target.closest('[data-edit-budget]');
    if(editBudgetBtn){const x=presupuestoById(editBudgetBtn.dataset.editBudget);if(x)openBudgetModal(x);return;}

    const analyzeReceiptBtn = event.target.closest('[data-receipt-analyze]');
    if (analyzeReceiptBtn) { analyzeReceipt(analyzeReceiptBtn); return; }

    const receiptBtn = event.target.closest('[data-receipt-id]');
    if (receiptBtn) { const receipt=receiptById(receiptBtn.dataset.receiptId); if(receipt) openReceiptDetail(receipt); return; }

    const attachReceiptBtn = event.target.closest('[data-attach-receipt]');
    if (attachReceiptBtn) { openReceiptScanner(attachReceiptBtn.dataset.attachReceipt); return; }

    if (linkReceiptBtn) { linkReceipt(linkReceiptBtn.dataset.linkReceipt,linkReceiptBtn.dataset.movementId,linkReceiptBtn); return; }

    const deleteReceiptBtn = event.target.closest('[data-delete-receipt]');
    if (deleteReceiptBtn) { deleteReceipt(deleteReceiptBtn.dataset.deleteReceipt,deleteReceiptBtn); return; }

    const useReceiptBtn = event.target.closest('[data-use-receipt]');
    if (useReceiptBtn) { const receipt=receiptById(useReceiptBtn.dataset.useReceipt); if(receipt){ state.receiptTargetMovementId=''; openReceiptReview(receipt); } return; }

    const goalBtn = event.target.closest('[data-goal-id]');
    if (goalBtn && !goalBtn.hasAttribute('data-goal-operation')) {
      const goal = goalById(goalBtn.dataset.goalId);
      if (goal) openGoalDetail(goal);

    const goalOpBtn = event.target.closest('[data-goal-operation][data-goal-id]');
    if (goalOpBtn) {
      const goal = goalById(goalOpBtn.dataset.goalId);

    const goalMovementBtn = event.target.closest('[data-goal-movement-id]');
    if (goalMovementBtn) {
      const item = goalMovementById(goalMovementBtn.dataset.goalMovementId);

    const editGoalBtn = event.target.closest('[data-edit-goal]');
    if (editGoalBtn) {
      const goal = goalById(editGoalBtn.dataset.editGoal);
      if (goal) openGoalModal(goal);

    const toggleGoalBtn = event.target.closest('[data-toggle-goal]');
    if (toggleGoalBtn) { toggleGoalState(toggleGoalBtn.dataset.toggleGoal,toggleGoalBtn.dataset.nextState,toggleGoalBtn); return; }

    const archiveGoalBtn = event.target.closest('[data-archive-goal]');
    if (archiveGoalBtn) { openConfirmArchiveGoal(archiveGoalBtn.dataset.archiveGoal); return; }

    const confirmArchiveGoalBtn = event.target.closest('[data-confirm-archive-goal]');
    if (confirmArchiveGoalBtn) { archiveGoal(confirmArchiveGoalBtn.dataset.confirmArchiveGoal,confirmArchiveGoalBtn); return; }

    const deleteGoalMovementBtn = event.target.closest('[data-delete-goal-movement]');
    if (deleteGoalMovementBtn) { deleteGoalMovement(deleteGoalMovementBtn.dataset.deleteGoalMovement,deleteGoalMovementBtn); return; }

    const entryBtn = event.target.closest('[data-entry-kind][data-entry-id]');
    if (entryBtn) {
      if (entryBtn.dataset.entryKind === 'TRANSFERENCIA') {
        const transfer = state.data?.transferencias?.find(t => String(t.id) === String(entryBtn.dataset.entryId));
        if (transfer) {
          const from = accountById(transfer.cuentaOrigenId);
          const to = accountById(transfer.cuentaDestinoId);
          if (from?.activa === false || to?.activa === false) {
            showToast('Transferencia histórica.', 'Reactiva las cuentas involucradas antes de editarla.', 'info');
          } else {
            openTransferModal(transfer);
          }
